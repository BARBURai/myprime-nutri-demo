<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ניהול · מיי פריים</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Crect x='14' y='17' width='36' height='6' rx='3' fill='%23f472b6'/%3E%3Crect x='14' y='29' width='36' height='6' rx='3' fill='%23ffffff'/%3E%3Crect x='14' y='41' width='23' height='6' rx='3' fill='%23ffffff' opacity='.65'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Crect x='14' y='17' width='36' height='6' rx='3' fill='%23f472b6'/%3E%3Crect x='14' y='29' width='36' height='6' rx='3' fill='%23ffffff'/%3E%3Crect x='14' y='41' width='23' height='6' rx='3' fill='%23ffffff' opacity='.65'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@700;800&display=swap">
<style>
  /* מסך עבודה למשרד. הוא נקרא כל היום, רובו במחשב, ולכן: ניגודיות אמיתית, כרטיסים
     לבנים שמונחים מעל רקע כהה יותר, וצבע רק במקום שבו הוא אומר "יש כאן מה לעשות".
     מכוון לאור בלבד, במכוון, כי זו הסביבה שבה הוא נפתח בפועל. */
  :root{
    --bg:#eceef3; --card:#ffffff; --card-2:#f5f6fa;
    --line:#dde0e9; --line-2:#bfc3d2;
    --ink:#12101a; --ink-2:#484556; --soft:#484556; --ink-3:#767488;
    --bar:#241a2e; --bar-2:#3a2a49; --bar-ink:#fbf4f8; --bar-ink-2:#c4b3d1;
    --pink:#bd1354; --pink-2:#9d0d45; --pinkbg:#fdeaf1; --pink-line:#f4bed4;
    --ok:#0d7a41; --okbg:#e3f4ea; --ok-line:#b6e0c6;
    --warn:#8a4c06; --warnbg:#fdf0dc; --warn-line:#f0d3a6;
    --danger:#b01f19; --dangerbg:#fdeae8; --danger-line:#f3c3bf;
    --cold:#17558f; --coldbg:#eff5fc; --cold-line:#a8c7e8;
    --sh1:0 1px 2px rgba(18,16,26,.06);
    --sh2:0 1px 3px rgba(18,16,26,.07), 0 10px 28px -14px rgba(18,16,26,.28);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.55 Assistant,"Segoe UI",Rubik,Arial,sans-serif;
    padding:env(safe-area-inset-top) 0 60px; font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  h1,.nm,.kpin{font-family:Heebo,Assistant,"Segoe UI",Arial,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:16px}
  input,select,button{font:inherit;color:inherit}
  a{color:var(--pink)}

  /* פס עליון כהה, כדי שלמסך יהיה עמוד שדרה ולא יתחיל באוויר */
  .topbar{
    background:linear-gradient(90deg,var(--bar) 0%,var(--bar-2) 100%);
    color:var(--bar-ink); border-radius:14px; padding:14px 18px; margin-bottom:14px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; box-shadow:var(--sh2);
  }
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.015em}
  .topbar .cnt{color:var(--bar-ink-2);font-size:13.5px;margin-inline-end:auto}
  .topbar .who{
    font-size:13px;color:var(--bar-ink);background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.17);border-radius:999px;padding:4px 12px;
  }
  .sub{color:var(--soft);font-size:14px;margin-bottom:16px}

  /* סרגל אחד, ובתוכו שני אזורים שאסור שייראו אותו דבר */
  .toolbar{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--sh2); padding:12px; margin-bottom:14px;
  }
  .zone{border-radius:11px; padding:9px 12px; margin-top:10px}
  .zone.work{background:var(--card-2); border:1px solid var(--line); box-shadow:inset 3px 0 0 var(--pink)}
  .zone.work.calm{box-shadow:inset 3px 0 0 var(--line-2)}
  .qhint{font-size:12.5px;color:var(--ink-3);margin:6px 2px 0}
  .zone.filt{border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .zone.filt > .chips{margin:0}
  /* שלוש רשימות נפתחות בשורה אחת. כל אחת מתכווצת ונשברת לשורה משלה בטלפון,
     אחרת רוחב האפשרות הארוכה ביותר דוחף את כל העמוד מעבר למסך. */
  .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sel{position:relative;display:flex;flex:1 1 170px;min-width:0}
  .sel select{
    width:100%;min-width:0;appearance:none;-webkit-appearance:none;font:inherit;color:inherit;
    background:var(--card);border:1px solid var(--line-2);border-radius:10px;
    padding-block:9px;padding-inline:12px 30px;font-size:14.5px;font-weight:600;
    min-height:42px;cursor:pointer;box-shadow:var(--sh1);
  }
  .sel::after{content:"\25be";position:absolute;inset-inline-end:11px;top:11px;font-size:12px;color:var(--ink-3);pointer-events:none}
  .sel select:hover{border-color:var(--ink-3)}
  .sel select:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--pinkbg)}
  input,select,textarea{max-width:100%}
  .zlab{
    display:block; font-size:11px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-3); margin-bottom:2px;
  }
  .zone.work .zlab{color:var(--pink)}
  .zone.work.calm .zlab{color:var(--ink-3)}
  .zone .chips{margin:6px 0 0}
  .zone .lbl{margin-top:9px}
  .zone .note{margin-top:8px}

  .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 0}
  .sel{position:relative;display:inline-flex}
  .sel select{
    appearance:none;-webkit-appearance:none;font:inherit;color:inherit;font-weight:600;
    background:var(--card);border:1px solid var(--line-2);border-radius:10px;
    padding-block:9px;padding-inline:13px 30px;min-height:40px;cursor:pointer;box-shadow:var(--sh1);
  }
  .sel::after{content:"\25be";position:absolute;inset-inline-end:11px;top:10px;font-size:12px;color:var(--ink-3);pointer-events:none}
  .sel select:hover{border-color:var(--ink-3)}
  .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2);font-weight:500}
  .btn.ghost:hover{background:var(--card-2)}
  .field{
    width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:11px;
    background:var(--card);box-shadow:var(--sh1);
  }
  .field:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--pinkbg)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .chip{
    padding:6px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);
    color:var(--ink-2);cursor:pointer;font-size:14px;font-weight:600;box-shadow:var(--sh1);
    transition:border-color .12s,background .12s,color .12s;
  }
  .chip:hover{border-color:var(--ink-3);background:var(--card-2)}
  .chip.on{background:var(--pinkbg);border-color:var(--pink);color:var(--pink)}
  .chip.warn{border-color:var(--warn-line);background:var(--warnbg);color:var(--warn)}
  .chip.warn.on{background:var(--warn);border-color:var(--warn);color:#fff}

  /* שתי עמודות במחשב: הרשימה מימין, הכרטיס של מי שנבחרה משמאל ונשאר במקומו בגלילה.
     מתחת ל-1000 פיקסלים זו עמודה אחת, והכרטיס הפתוח תופס את המסך כמו באפליקציה. */
  .split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
  @media (min-width:1000px){
    .split{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
    /* הכרטיס נשאר במקומו בזמן שגוללים את הרשימה. כשהוא ארוך מהמסך הוא גולל בעצמו,
       אחרת התחתית שלו הייתה בלתי נגישה. */
    .pane.detail{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
  }
  .pane.list{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);overflow:hidden}
  .phead{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 15px;border-bottom:1px solid var(--line);background:var(--card-2);
    font-size:12.5px;color:var(--ink-2);font-weight:600;
  }
  .lrow{
    width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);
    padding:12px 15px;cursor:pointer;display:grid;gap:4px;transition:background .1s;
  }
  .lrow:last-child{border-bottom:0}
  .lrow:hover{background:var(--card-2)}
  .lrow.on{background:var(--pinkbg);box-shadow:inset 3px 0 0 var(--pink)}
  .lrow .row1{gap:6px}
  .lrow .nm{font-size:16px}
  .lrow .meta{margin-top:0;font-size:13.5px}
  .workline{
    font-size:13px;color:var(--warn);background:var(--warnbg);border-radius:7px;
    padding:5px 9px;margin-top:2px;
  }
  /* כפילות בגיליון: אותה כתובת מייל בכמה שורות, או אותו טלפון על כמה כתובות.
     הקופסה יושבת על הכרטיס שלה, כי שתי שורות נראות בדיוק כמו שורה אחת. */
  /* כותרת חלק בתוך מסך "בעיות בגיליון". שני סוגי בעיות באותו מסך, ולכן חייב
     להיות ברור איפה אחד נגמר והשני מתחיל. */
  .psec{
    font-family:Heebo,system-ui,sans-serif;font-weight:700;font-size:15px;color:var(--ink);
    margin:22px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line);
  }
  .psec:first-child{margin-top:0}
  .dupbox{
    font-size:13px;color:var(--warn);background:var(--warnbg);border-radius:9px;
    padding:8px 10px;margin-top:8px;line-height:1.65;
  }
  .dupbox b{display:block}
  .btn.back{display:none;margin-bottom:11px}
  /* טלפון: פחות ריווח, ובלי הכרטיס הריק שתופס חצי מסך כשלא נבחרה אף אחת. */
  @media (max-width:640px){
    .wrap{padding:10px}
    .topbar{padding:12px 14px;border-radius:12px;gap:8px}
    h1{font-size:17px}
    .topbar .cnt{font-size:12.5px}
    .toolbar{padding:10px;border-radius:12px}
    .zone{padding:8px 10px}
    .split:not(.haspick) .pane.detail{display:none}
    /* כרטיס פתוח בטלפון: החיפוש והסינון רק דוחפים אותו למטה. */
    .toolbar.picked{display:none}
    .pane.list,.card{border-radius:12px}
    .lrow{padding:11px 12px}
    .lrow .nm{font-size:15.5px}
    .grp{font-size:11px;padding:2px 8px}
    .dhead{padding:13px 13px 12px}
    .dhead .nm{font-size:18px}
    .tabwrap{padding:13px 13px 16px}
    .qa{font-size:13px;padding:6px 12px 6px 10px;min-height:34px}
    .field{padding:11px 12px}
    .edit{margin-top:11px;padding-top:11px}
  }
  @media (max-width:999px){
    .split.haspick .pane.list{display:none}
    .btn.back{display:inline-flex}
  }
  .card.open{margin-bottom:0;padding:0}
  .dhead{padding:16px 17px 14px;border-bottom:1px solid var(--line);background:var(--card-2)}
  .dhead .nm{font-size:20px}
  .dhead .meta{margin-top:6px}
  .dhead .workline{margin-top:8px}

  /* ארבעה סוגים של פעולה, וכל אחד נראה אחרת: עריכה רגילה, מה שדורש טיפול,
     פעולה הרסנית, ויצירת קשר. שורה של כפתורים זהים לא אומרת כלום. */
  .dacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.qsel{
  font-family:inherit;font-weight:700;font-size:.92rem;cursor:pointer;
  min-width:170px;max-width:220px;
}
.qsel.need{border-color:#C9772A;color:#8A4B12;background:#FFF6EC}

  .qa{
    background:var(--card);border:1px solid var(--line-2);border-radius:999px;
    padding:7px 14px 7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:36px;
    display:inline-flex;align-items:center;gap:7px;box-shadow:var(--sh1);color:var(--ink);
    text-decoration:none;transition:border-color .12s,background .12s,color .12s;
  }
  .qa:hover{border-color:var(--ink-3);background:var(--card-2)}
  .qa svg{opacity:.55;flex:none}
  .qa:hover svg{opacity:.9}
  .qa.need{background:var(--warnbg);border-color:var(--warn-line);color:var(--warn)}
  .qa.need:hover{background:var(--warn);border-color:var(--warn);color:#fff}
  .qa.cold{background:var(--coldbg);border-color:var(--cold-line);color:var(--cold)}
  .qa.cold:hover{background:var(--cold);border-color:var(--cold);color:#fff}
  .qa.kill{background:var(--dangerbg);border-color:var(--danger-line);color:var(--danger)}
  .qa.kill:hover{background:var(--danger);border-color:var(--danger);color:#fff}
  .qa.wa{background:var(--okbg);border-color:var(--ok-line);color:var(--ok)}
  .qa.wa:hover{background:var(--ok);border-color:var(--ok);color:#fff}
  .qa.need svg,.qa.kill svg,.qa.cold svg,.qa.wa svg{opacity:1}

  .tabs{display:flex;gap:2px;padding:0 9px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--card)}
  .tab{
    background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;
    cursor:pointer;font-size:14px;color:var(--ink-2);white-space:nowrap;font-weight:600;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--pink);border-bottom-color:var(--pink)}
  .tabwrap{padding:15px 17px 18px;display:grid;gap:13px}
  .tabwrap > .edit:first-child,.tabwrap > .pair:first-child{margin-top:0;padding-top:0;border-top:0}
  .tabwrap .note{margin-top:0}

  .pair{display:grid;gap:13px;grid-template-columns:minmax(0,1fr)}
  @media (min-width:520px){ .pair{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)} }
  .fld{display:grid;gap:5px}
  .flabel{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink-2)}
  .fval{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .control{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}

  .frz{display:grid;gap:2px;padding:13px;border-radius:12px;border:1px solid var(--cold-line);background:var(--coldbg)}
  .frz.todo{border-color:var(--warn-line);background:var(--warnbg)}
  .frzhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--cold)}
  .frz.todo .frzhead{color:var(--warn)}
  .frzhead span{color:var(--ink-2);font-size:13.5px}
  .frz .note{margin-top:8px}

  .tbadge{
    display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
    border-radius:999px;background:#d97706;color:#fff;font-size:12px;font-weight:800;
    font-style:normal;padding:0 6px;margin-inline-start:7px;
    box-shadow:0 0 0 3px rgba(217,119,6,.18);
  }
  /* "יש כאן מה לענות" הוא הדבר היחיד בשורה שדורש פעולה, ולכן הוא מלא ולא רך */
  .grp.notepill{background:#d97706;color:#fff;border-color:#b45309;font-weight:800}
  .note-card{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--card)}
  .note-card.done{background:var(--card-2)}
  .nhead{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .ntext{font-size:15.5px;color:var(--ink);margin-top:5px;line-height:1.6;white-space:pre-wrap}
  .nhint{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.55}
  .nsent{font-size:12.5px;color:var(--ink-2);margin-top:9px}
  .okread{color:var(--ok);font-weight:700}
  .nreply{
    margin-top:7px;padding:10px 12px;border-radius:10px;background:var(--pinkbg);
    color:var(--ink);font-size:15px;line-height:1.6;white-space:pre-wrap;
  }
  .qhead{font-size:14px;color:var(--ink-2);font-weight:600;margin:0 2px 12px}
  .qitem{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--sh2);padding:14px;margin-bottom:12px;
  }
  .qwho{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
  .qwho .lnk{font-size:17px;font-weight:800;text-decoration:none;font-family:Heebo,Assistant,sans-serif}
  .qwhen{font-size:13px;color:var(--ink-2);font-weight:600}
  .qinfo{
    display:grid;gap:7px;margin:0 0 12px;padding:11px 13px;border-radius:11px;
    background:var(--card-2);border:1px solid var(--line);font-size:14px;
  }
  .qinfo .flabel{display:inline}
  .qprev{display:grid;gap:9px;margin-top:4px}
  .qprev-none{color:var(--ink-3);font-size:13.5px}
  .qprev-i{border-inline-start:3px solid var(--line-2);padding-inline-start:10px}
  .qprev-q{font-size:13.5px;color:var(--ink-2)}
  .qprev-a{
    margin-top:5px;padding:9px 11px;border-radius:9px;background:var(--pinkbg);
    color:var(--ink);font-size:14.5px;line-height:1.6;white-space:pre-wrap;
  }
  .qprev-m{font-size:12.5px;color:var(--ink-3);margin-top:4px}
  .whybox{
    margin-top:11px;display:grid;gap:4px;padding:11px 13px;border-radius:11px;
    background:var(--warnbg);border:1px solid var(--warn-line);
  }
  .whybox b{font-size:13.5px;color:var(--warn)}
  .whybox span{font-size:13.5px;color:var(--ink-2);line-height:1.55}
  .qitem .note-card{border:0;padding:0;box-shadow:none;background:none}
  .sugbox{margin-top:11px;display:grid;gap:6px}
  .sug{
    display:grid;gap:3px;text-align:start;width:100%;cursor:pointer;
    background:var(--coldbg);border:1px solid var(--cold-line);border-radius:10px;padding:9px 11px;
  }
  .sug:hover{border-color:var(--cold)}
  .sug b{font-size:13.5px;color:var(--cold);font-weight:700}
  .sug .use{
    font-style:normal;font-size:12.5px;font-weight:700;color:#fff;background:var(--cold);
    border-radius:999px;padding:4px 10px;justify-self:start;margin-top:3px;
  }
  .sug:hover .use{filter:brightness(1.1)}
  .sug span{font-size:13.5px;color:var(--ink-2);line-height:1.55}
  .bankadd{
    display:flex;align-items:center;gap:7px;margin-top:10px;
    font-size:13px;color:var(--ink-2);cursor:pointer;
  }
  .bankadd input{width:16px;height:16px;accent-color:var(--pink);cursor:pointer}
  .note-card textarea.field{margin-top:5px;resize:vertical;font-family:inherit}
  .lit{outline:2px solid var(--pink);outline-offset:6px;border-radius:9px}
  /* שלוש רשימות שלנו במקום בורר התאריך של הדפדפן. ראה dateBox. */
  .dbox{display:inline-flex;gap:5px;align-items:center}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;margin-bottom:11px;box-shadow:var(--sh2);
  }
  .row1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

  .solopill{background:#EDE7F6;color:#4A2E7A;border-color:#D6C9EE}

  .adds{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="wrap" id="app"><div class="empty">טוען...</div></div>

<script>
// Office tool. Everything here reads the registration sheet and writes ONLY to our own
// store: a change made here never touches that file, because ManyChat and the access gate
// both depend on it. The screen therefore always shows the sheet's value next to a manual
// change rather than replacing it.
var PROG = "";   // סינון לפי תוכנית: "" הכל, "360", "6" או "12"
var UNTILING = "";   // הכרטיס שבו שדה "גישה עד" פתוח לעריכה
var KEY = "", WHO = "", DATA = null, APP = "new", YEAR = null, MONTH = null, COHORT = "", GROUP = "", SHOWCANCELLED = false, MISSING = false, EDITING = "";
var HEB_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function monthLabel(ym){ var p = ym.split("-"); return HEB_MONTHS[parseInt(p[1],10)-1]+" "+p[0]; }
var STATS = "", STATSMODE = "day";   // which card has its usage panel open, and at what zoom
// The repeat-view counter shipped with v4.98 and has no history before that date. Saying so
// stops "0" from reading as "she watched nothing".
var VIEWS_SINCE = "2026-08-13";
// Which women still need a group letter is decided in api/admin.js (needsGroup), so the
// rule has one home and the offline check covers it.
var app = document.getElementById("app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function il(d){ if(!d) return ""; var p=d.split("-"); return p[2]+"."+p[1]+"."+p[0]; }
// מספר טלפון מנוקה: בלי פלוס, בלי רווחים, בלי מקפים, בלי 972 ובלי אפס מוביל.
// כך "+972 54-767-6619", "054-7676619" ו-"547676619" נראים אותו דבר בחיפוש.
// מה שהודבק נחשב מספר טלפון רק כשאין בו אותיות ואין בו שטרודל. בלי הכלל הזה כתובת
// מייל שיש בה ספרות נקראה כמספר: "lior5066@gmail.com" חיפש את 5066, וכל אישה עם
// מספר בקידומת 050-66 נכנסה לתוצאות, כי המספר שלה מתחיל ב-5066 אחרי ניקוי.
function isPhoneQ(q){
  var t = String(q == null ? "" : q).trim();
  return /^[0-9+()\-. ]+$/.test(t) && t.replace(/[^0-9]/g, "").length >= 3;
}
// חיפוש שמחזיר ריק אינו תשובה. הוא חייב לומר מה בדיוק חיפש ובכמה רשומות, כדי
// שיהיה ברור אם המספר לא הובן או שהיא פשוט לא שם.
// התאריך נבחר בשלוש רשימות שלנו, יום חודש ושנה, ולא בבורר התאריך של הדפדפן.
// הבורר המובנה מצייר לפי הגדרת השפה של המכשיר שיושבים עליו, ולכן אצל אחד הוא
// חודש-יום ואצל אחר יום-חודש, ואין שום דרך להגיד לו מה לעשות. הערך עצמו נשמר
// כמו קודם, YYYY-MM-DD בשדה מוסתר, ולכן כל מה שקורא אותו לא השתנה.
function daysInMonth(y,m){ return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function dateBox(em, iso){
  var p = String(iso||"").split("-");
  var y = parseInt(p[0],10) || parseInt(String(DATA.today).slice(0,4),10);
  var m = parseInt(p[1],10) || 1;
  var d = parseInt(p[2],10) || 1;
  var y0 = Math.min(y, parseInt(String(DATA.today).slice(0,4),10));
  var days = "", months = "", years = "", i;
  for(i=1;i<=daysInMonth(y,m);i++) days += '<option value="'+i+'"'+(i===d?" selected":"")+'>'+i+'</option>';
  for(i=1;i<=12;i++) months += '<option value="'+i+'"'+(i===m?" selected":"")+'>'+HEB_MONTHS[i-1]+'</option>';
  for(i=y0;i<=y0+10;i++) years += '<option value="'+i+'"'+(i===y?" selected":"")+'>'+i+'</option>';
  return '<input type="hidden" id="d_'+esc(em)+'" value="'+esc(iso||"")+'">'+
    '<span class="dbox">'+
      '<select class="field sm" style="width:66px" aria-label="יום" data-dpart="'+esc(em)+'" id="dd_'+esc(em)+'">'+days+'</select>'+
      '<select class="field sm" style="width:100px" aria-label="חודש" data-dpart="'+esc(em)+'" id="dm_'+esc(em)+'">'+months+'</select>'+
      '<select class="field sm" style="width:84px" aria-label="שנה" data-dpart="'+esc(em)+'" id="dy_'+esc(em)+'">'+years+'</select>'+
    '</span>';
}
// מרכיב מחדש את רשימת הימים לפי החודש והשנה שנבחרו, כדי שלא יהיה 31 בפברואר,
// וכותב את הערך לשדה המוסתר.
function dateSync(em){
  var ys=document.getElementById("dy_"+em), ms=document.getElementById("dm_"+em), ds=document.getElementById("dd_"+em);
  if(!ys||!ms||!ds) return;
  var y=parseInt(ys.value,10), m=parseInt(ms.value,10), want=parseInt(ds.value,10)||1;
  var max=daysInMonth(y,m), i, html="";
  if(ds.options.length !== max){
    for(i=1;i<=max;i++) html += '<option value="'+i+'">'+i+'</option>';
    ds.innerHTML = html;
    ds.value = Math.min(want, max);
  }
  var d=parseInt(ds.value,10);
  document.getElementById("d_"+em).value = y+"-"+(m<10?"0":"")+m+"-"+(d<10?"0":"")+d;
}
function dateSet(em, iso){
  var p = String(iso).split("-");
  var ys=document.getElementById("dy_"+em), ms=document.getElementById("dm_"+em);
  if(!ys||!ms) return;
  var y=parseInt(p[0],10);
  // שנה שנוצרה מ"הוסיפי" ואינה ברשימה נוספת אליה, אחרת הבחירה הייתה מתרוקנת בשקט.
  if(!Array.prototype.some.call(ys.options,function(o){ return parseInt(o.value,10)===y; })){
    var o=document.createElement("option"); o.value=y; o.textContent=y; ys.appendChild(o);
  }
  ys.value = y;
  ms.value = parseInt(p[1],10);
  dateSync(em);
  document.getElementById("dd_"+em).value = parseInt(p[2],10);
  dateSync(em);
}

function searchMiss(q){
  var n = (DATA && DATA.women || []).length;
  var scanned = "נסרקו כל " + n + " הרשומות בגיליון.";
  if(isPhoneQ(q)){
    return "לא נמצאה אף משתתפת עם המספר הזה.<div class=\"note\">חיפשתי <b class=\"mono\">" +
      esc(phoneKey(q)) + "</b>, בלי תלות בפלוס, ברווחים, במקפים, בקידומת 972 או באפס שבהתחלה. " +
      scanned + " אם היא אמורה להיות שם, <b>המספר שרשום אצלה בגיליון שונה מזה.</b></div>";
  }
  return "לא נמצאה אף משתתפת." + "<div class=\"note\">חיפשתי \u201c" + esc(q) + "\u201d בשם, בשם המשפחה ובכתובת המייל. " + scanned + "</div>";
}

function phoneKey(s){
  var d = String(s == null ? "" : s).replace(/[^0-9]/g, "");
  if(d.indexOf("00") === 0) d = d.slice(2);
  if(d.indexOf("972") === 0) d = d.slice(3);
  else if(d.charAt(0) === "0") d = d.slice(1);
  return d;
}
// Cohorts start on a Sunday, so "this week's" cohort is the most recent Sunday and the next
// one is seven days later. Naming them saves the clerk working it out from a date.
function weekSundays(){
  var t = new Date(DATA.today+"T00:00:00Z");
  t.setUTCDate(t.getUTCDate() - t.getUTCDay());       // Sunday of the current week
  var cur = t.toISOString().slice(0,10);
  t.setUTCDate(t.getUTCDate() + 7);
  return { cur: cur, next: t.toISOString().slice(0,10) };
}
function cohortLabel(d){
  if(!DATA) return il(d);
  var w = weekSundays();
  if(d === w.cur) return "מחזור נוכחי · "+il(d);
  if(d === w.next) return "המחזור הבא · "+il(d);
  return il(d);
}
// Copy to clipboard with a visible confirmation. A clerk on a phone cannot select text out
// of a card reliably, and the phone and the email are the two things she is always after.
function copyText(txt, el){
  var done = function(){ var old = el.textContent; el.textContent = "הועתק ✓";
    setTimeout(function(){ el.textContent = old; }, 1200); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ alert(txt); }
    document.body.removeChild(ta);
  }
}
function stamp(iso){ if(!iso) return ""; var d=new Date(iso); if(isNaN(d)) return "";
  var p=function(n){return (n<10?"0":"")+n;};
  return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function days(a,b){ return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000); }

function dayInProgram(w){
  if(!w.start||!DATA) return "";
  var n = days(w.start, DATA.today)+1;
  if(n<1) return "טרם התחילה";
  // The same reading the woman sees in her own tracker: cohorts start on a Sunday, so day 1
  // is Sunday and day 7 is Saturday. Past day 70 the programme is over and there is no
  // week 11, so the plain day number is the honest answer.
  if(n>70) return "יום "+n+" · אחרי סיום התוכנית";
  return "שבוע "+(Math.floor((n-1)/7)+1)+" יום "+(((n-1)%7)+1);
}
function lastSeen(w){
  if(!w.seen) return "עוד לא נכנסה";
  var n = days(w.seen, DATA.today);
  if(n<=0) return "נכנסה היום";
  if(n===1) return "נכנסה אתמול";
  return "נכנסה לפני "+n+" ימים";
}

// Her progress, drawn from counts only. Programme day N maps to week/day the same way the
// tracker does: cohorts start on Sunday, so day 1 is Sunday and day 7 is Saturday.
function usageBars(u, mode, upToDay){
  var out = [];
  if(mode === "week"){
    var lastWeek = Math.min(10, Math.ceil(upToDay/7));
    for(var wk=1; wk<=lastWeek; wk++){
      var got=0, tot=0;
      for(var dy=1; dy<=7; dy++){
        if((wk-1)*7+dy > upToDay) break;      // a week still in progress counts only its days so far
        var p = u.days[wk+"-"+dy];
        if(p){ got += p[0]; tot += p[1]; }
      }
      if(tot) out.push({ label:"ש"+wk, pct: Math.round(got*100/tot), title:"שבוע "+wk+": "+got+" מתוך "+tot });
    }
    return out;
  }
  for(var n=1; n<=upToDay; n++){
    var w2 = Math.floor((n-1)/7)+1, d2 = ((n-1)%7)+1;
    var pair = u.days[w2+"-"+d2];
    if(!pair) continue;                        // Saturdays carry no content
    out.push({ label:String(n), pct: Math.round(pair[0]*100/pair[1]),
               title:"שבוע "+w2+" יום "+d2+": "+pair[0]+" מתוך "+pair[1] });
  }
  return out;
}

function usagePanel(w){
  var u = w.usage;
  if(!u) return '<div class="stats"><div class="meta">אין עדיין נתוני שימוש. הם נאספים בפעם הבאה שהיא תפתח את האפליקציה.</div></div>';

  // Only days she has actually reached. Drawing the rest of the programme as empty bars made
  // a woman on day 6 look as though she had missed the twelve days after it.
  // The Glow bonus, on its own line and never inside the percentage below. It is the one
  // number that matters before her cycle starts, because she can watch the bonus while she
  // waits, and it is what says who to offer the full course to.
  var glowLine = "";
  if(u.glowTotal){
    glowLine = '<div class="statline">💄 <b>'+(u.glowDone||0)+'</b> מתוך '+u.glowTotal+' שיעורי Glow'+
      (u.glowViews ? ' · <b>'+u.glowViews+'</b> צפיות' : '')+
      (!u.glowDone && u.glowStarted ? ' · התחילה לצפות' : '')+
      (!u.glowDone && !u.glowStarted ? ' · עוד לא התחילה' : '')+'</div>';
  }

  var today = w.start ? Math.max(0, Math.min(70, days(w.start, DATA.today)+1)) : 70;
  if(!today) return '<div class="stats">'+glowLine+'<div class="meta">המחזור שלה עוד לא התחיל.</div></div>';

  var tot=0, got=0;
  for(var n=1; n<=today; n++){
    var pair = u.days[(Math.floor((n-1)/7)+1)+"-"+(((n-1)%7)+1)];
    if(pair){ got += pair[0]; tot += pair[1]; }
  }
  var bars = usageBars(u, STATSMODE, today);
  return '<div class="stats">'+
    '<div class="statline"><b>'+(tot?Math.round(got*100/tot):0)+'%</b> מהתכנים שנפתחו לה · '+
      '<b>'+u.videosDone+'</b> סרטונים · '+
      '<b>'+u.trackerDays+'</b> ימי יומן מעקב'+
      (u.views ? ' · <b>'+u.views+'</b> צפיות חוזרות' : '')+'</div>'+
    glowLine+
    (u.views ? '' : '<div class="meta">צפיות חוזרות נספרות מ-'+il(VIEWS_SINCE)+'.</div>')+
    '<div class="chips"><span class="chip'+(STATSMODE==="day"?" on":"")+'" data-sm="day">לפי יום</span>'+
      '<span class="chip'+(STATSMODE==="week"?" on":"")+'" data-sm="week">לפי שבוע</span></div>'+
    (bars.length
      ? '<div class="bars">'+bars.map(function(b){
          return '<div class="bar" title="'+esc(b.title)+'">'+
            '<div class="barbox"><div class="barfill" style="height:'+Math.max(b.pct,2)+'%"></div></div>'+
            '<div class="barlbl">'+esc(b.label)+'</div></div>';
        }).join("")+'</div>'+
        '<div class="meta">כל עמודה היא יום בתוכנית. הגובה הוא כמה מהתכנים של אותו יום היא סיימה.</div>'
      : '<div class="meta">עוד לא צפתה בשום תוכן.</div>')+
    '</div>';
}

// Her ManyChat record is keyed by phone, not by email, so every save carries it. Attached
// here rather than at each button, so no call site can forget it.
function phoneOf(email){
  var w = (DATA && DATA.women || []).filter(function(x){ return x.email === email; })[0];
  return (w && w.phone) || "";
}

// What ManyChat says about one woman right now, keyed by email. Read only when her card is
// opened: ManyChat cannot list everyone carrying a tag, so there is no bulk version of this.
var MC = {};
function bankLoad(then){
  fetch("/api/admin?key="+encodeURIComponent(KEY)+"&bank=1")
    .then(function(r){ return r.json(); })
    .then(function(d){ BANK = ((d && d.ok && d.bank) || []).concat(BANK_SEED); if(then) then(); render(); })
    .catch(function(){ BANK = BANK_SEED.slice(); if(then) then(); render(); });
}

// למה פעולה נכשלה, במילים של הפקידה. שגיאה שלא מוסברת נקראת כתקלה אצלנו, וגורמת
// לה לנסות שוב את אותו דבר בדיוק.
function mcWhy(d){
  var e = (d && (d.error || d.mc)) || "";
  if(e === "email_taken") return "הכתובת הזאת כבר רשומה על מישהי אחרת.";
  if(e === "row_gone")    return "לא מצאתי את השורה שלה בגיליון לפי הטלפון הזה.";
  if(e === "bad_email")   return "כתובת המייל לא תקינה.";

// דירוג פשוט לפי מילים משותפות, בלי AI ובלי עלות: הבנק קטן, וההצעה היא נקודת פתיחה
// לניסוח ולא תשובה שנשלחת לבד. מילות קישור מדולגות, כי הן מופיעות בכל משפט ומייצרות
// התאמות שווא, והתאמה בשאלה שוקלת כפול מהתאמה בגוף התשובה.
var STOP = ["איפה","איך","למה","מתי","מה","זה","זאת","אני","את","של","עם","לא","כן","יש","אין","על","אבל","גם","כמה","הוא","היא","הזה","הזאת","שלי","אפשר","צריך","צריכה","רוצה","תודה","היי","שלום","אחלה","ממש","מאוד","בבקשה"];
function bankSuggest(text){
  if(!BANK) return [];
  var clean = String(text||"").replace(/^\[נכתב [^\]]*\]\s*/, "").toLowerCase();
  var words = clean.replace(/[^\u0590-\u05ea0-9a-z ]/g," ").split(/\s+/)
    .filter(function(w){ return w.length >= 3 && STOP.indexOf(w) === -1; });
  // הערה קצרה מדי לא מספיקה לזיהוי: "המשקל שגוי" חלקה מילה אחת עם התשובה על הברקוד
  // וקיבלה ציון גבוה על סמך מילה אחת בלבד.
  if(words.length < 3) return [];
  return BANK.map(function(e){
    var q = String(e.q||"").toLowerCase(), a = String(e.a||"").toLowerCase();
    var score = 0, hits = 0;
    words.forEach(function(w){
      if(q.indexOf(w) !== -1) { score += 2; hits++; }
      else if(a.indexOf(w) !== -1) { score += 1; hits++; }
    });
    return { e:e, score: hits >= 2 ? score / (words.length * 2) : 0 };
  }).filter(function(x){ return x.score >= 0.34; })
    .sort(function(a,b){ return b.score - a.score; })
    .slice(0, 3).map(function(x){ return x.e; });
}

// The local store and ManyChat are written one after the other, and the local one is never
// held back by the other. So when the second half fails the clerk has to be told exactly
// that, otherwise she walks away believing the sheet will catch up on its own.
function mcWarn(r){
  // אותו טלפון על כמה רשומות במניצ'ט. הכתיבה מגיעה לראשונה בלבד, ולכן היא יכולה
  // לנחות על הרשומה הלא נכונה **בזמן שהכל נראה כמו הצלחה**. נאמר לפני כל דבר
  // אחר, וגם כשהכתיבה הצליחה, כי דווקא שם זה נראה תקין ואינו.
  if(r && r.mcMulti > 1){
    alert("⚠ במניצ'ט יש "+r.mcMulti+" רשומות עם הטלפון הזה. הכתיבה הגיעה לראשונה בלבד.\n\nכדאי לוודא שם שהשינוי נחת על הרשומה הנכונה.");
  }
  if(!r || r.mc === "ok" || r.mc === "off" || !r.mc) return;
  if(String(r.mc).indexOf("ok:") === 0) return;
  if(String(r.mc).indexOf("startfail:") === 0) return;   // has a message of its own
  alert(r.mc === "not_found"
    ? "נשמר אצלנו, אבל לא נמצאה רשומה במניצ'ט לפי הטלפון שלה, ולכן שם שום דבר לא השתנה."
    : "נשמר אצלנו, אבל העדכון במניצ'ט נכשל. שווה לנסות שוב.");
}

// The eight cohorts she can be moved to: the one already running this week, and the seven
// after it. A cohort always begins on a Sunday, and the app leans on that in two separate
// places, so the dates are computed here and never typed.
function sundaysN(n){
  var out=[], base=new Date(DATA.today+"T00:00:00Z");
  base.setUTCDate(base.getUTCDate()-base.getUTCDay()+7);
  for(var i=0;i<n;i++){ var d=new Date(base.getTime()); d.setUTCDate(d.getUTCDate()+i*7); out.push(d.toISOString().slice(0,10)); }
  return out;
}

// תאריכי החזרה מהקפאה. **לא רק ימי ראשון עתידיים.** רון, 30 באוגוסט 2026: "אני
// רוצה להכניס מישהי מהקפאה לשבוע הקיים והיא נכנסת בשבוע השני שלה, וכשאני לוחץ
// על הקפאה אני לא מקבל את השבוע הנוכחי וגם לא שבועות שהיו."
// **תאריך של היום או של העבר פירושו שהיא חוזרת מיד**, וזה עובד מעצמו: השער חוסם
// אותה רק כל עוד היום קטן מתאריך החזרה. ארבעה אחורה, הנוכחי, ועשרה קדימה.
function freezeSundays(){
  var out=[], base=new Date(DATA.today+"T00:00:00Z");
  base.setUTCDate(base.getUTCDate()-base.getUTCDay()-4*7);
  for(var i=0;i<15;i++){ var d=new Date(base.getTime()); d.setUTCDate(d.getUTCDate()+i*7); out.push(d.toISOString().slice(0,10)); }
  return out;
}

function sundays(){
  var out=[], base=new Date(DATA.today+"T00:00:00Z");
  base.setUTCDate(base.getUTCDate()-base.getUTCDay());
  for(var i=0;i<8;i++){
    var d=new Date(base.getTime()); d.setUTCDate(d.getUTCDate()+i*7);
    out.push(d.toISOString().slice(0,10));
  }
  return out;
}

// The sheet says one number and the screen shows another, and until now there was no way to
// see where the difference went: Ron marked 123 women and the screen showed 103. Every row
// that never became a woman on this screen is counted, so the gap is named out loud instead
// of being read as a bug.
function appGap(){
  var marked = DATA.sheetNewAppRows || 0;
  if(!marked) return "";
  var shown = 0, noStart = 0, cancelled = 0;
  DATA.women.forEach(function(w){
    if(!w.sheetNewApp) return;
    if(w.cancelled){ cancelled++; return; }
    if(!w.start){ noStart++; return; }
    shown++;
  });
  var sk = DATA.skipped || {};
  var gap = marked - shown;
  if(gap <= 0) return '<div class="note">בגיליון מסומנות '+marked+' באפליקציית תזונה, וכולן מוצגות.</div>';
  var why = [];
  if(noStart) why.push(noStart+' בלי תאריך התחלה');
  if(cancelled) why.push(cancelled+' מסומנות שביטלו');
  if(sk.newAppDuplicate) why.push(sk.newAppDuplicate+' עם מייל שכבר מופיע בשורה אחרת');
  if(sk.newAppNoEmail) why.push(sk.newAppNoEmail+' בלי כתובת מייל');
  var rest = gap - noStart - cancelled - (sk.newAppDuplicate||0) - (sk.newAppNoEmail||0);
  if(rest > 0) why.push(rest+' מסיבה אחרת');
  return '<div class="note">בגיליון מסומנות <b>'+marked+'</b> באפליקציית תזונה, ומוצגות <b>'+shown+'</b>. '+
    'ההפרש: '+why.join(" · ")+'. <b>מי שאין לה תאריך התחלה אינה משתתפת בתוכנית שרצה ולכן אינה מוצגת כאן.</b></div>';
}

// בנק התשובות. נטען פעם אחת, ומשמש להצעת ניסוח להערה חדשה.

function teamBlock(){

    return '<div class="edit"><span><b>'+esc(c.name||"בלי שם")+'</b></span>'+

    '<div class="row1"><span class="nm">👥 צוות המשרד</span>'+

    '<div class="edit"><span>שם:</span>'+
      '<input class="field sm" style="max-width:200px" id="newname" placeholder="למשל טלי">'+
      '<button class="btn p" data-newcode="1">יצירת קוד</button></div>'+

// תג התוכנית. סולו למי שיש לה, ו-360 לכל השאר. הוא נשאר גם למי שביטלה, לפי
// החלטת רון: תג לא יורד, כי צריך לדעת באיזו תוכנית היא הייתה. הביטול הוא תג
// נוסף לצידו ולא במקומו.
function progPill(w){
  if(w.solo) return '<span class="grp solopill">סולו '+w.solo+'</span>';
  return '<span class="grp p360pill">360</span>';
}

// קפיצה לשדה מתוך תפריט הפעולות המהירות: פותחת את הלשונית הנכונה, גוללת אליו
// ומקיפה אותו במסגרת לשנייה.
//
// היא חייבת לשבת כאן ולא בתוך render. המאזין שקורא לה יושב ב-wire, ש-render
// אינו עוטף אותה, ולכן כשהיא הייתה בפנים הוא לא ראה אותה בכלל וכל בחירה
// בתפריט זרקה "jumpTo is not defined". זה היה שם מ-v5.70, בשקט מוחלט, כי
// שגיאת ריצה במסך הזה אינה נתפסת בשום בדיקה שקוראת קוד או מריצה שרת.
function jumpTo(id){
  TAB = (id==="fld-mail"||id==="fld-name") ? "info" : (id==="fld-until"||id==="fld-cancel"||id==="fld-glow") ? "perm" : "cohort";
  if(id==="fld-name") NAMING = SEL;
  if(id==="fld-until") UNTILING = SEL;
  render();
  var t = document.getElementById(id);
  if(!t) return;
  t.scrollIntoView({ block:"center", behavior:"smooth" });
  t.classList.add("lit");
  setTimeout(function(){ t.classList.remove("lit"); }, 1500);
}

function render(){
  // מה שהיא הקלידה, כפי שהיא הקלידה אותו, ומה שמחפשים לפיו. **שני דברים שונים,
  // וזה מה שהיה שבור:** השדה צויר מחדש בכל הקשה עם הערך המנוקה, ולכן רווח בסוף
  // נמחק ברגע שהוקלד ואי אפשר היה לכתוב שם פרטי ושם משפחה. רון, 2 בספטמבר 2026:
  // "הוא לא נותן לי לרשום רווח, משהו מוזר." ובדרך גם כל אות גדולה הפכה לקטנה
  // מתחת לאצבע. **הערך המנוקה משמש להתאמה בלבד ולעולם לא נכתב חזרה לשדה.**
  var qRaw = document.getElementById("q") ? document.getElementById("q").value : "";
  var q = qRaw.trim().toLowerCase();

  // A group is a cohort AND a letter together. Every cohort runs א..ה (two to five of them),
  // so "קבוצה ב" of the January intake and "קבוצה ב" of the April intake are different
  // groups of different women. Merging them by letter alone is what produced "ב (522)".
  var pool = [], nNew = 0, nOld = 0, n360 = 0, nS6 = 0, nS12 = 0;
  DATA.women.forEach(function(w){
    if(w.cancelled && !SHOWCANCELLED) return;
    if(!w.start) return;
    if(w.newApp) nNew++; else nOld++;
    if(APP==="new" && !w.newApp) return;
    if(APP==="old" && w.newApp) return;
    // הספירה לפני הסינון עצמו, בדיוק כמו אפליקציה חדשה מול קג'אבי, כדי שהמספר
    // שליד כל אפשרות יגיד כמה יש בה ולא כמה נשארו אחרי שכבר בחרו אותה.
    if(w.solo===6) nS6++; else if(w.solo===12) nS12++; else n360++;
    if(PROG==="360" && w.solo) return;
    if(PROG==="6" && w.solo!==6) return;
    if(PROG==="12" && w.solo!==12) return;
    pool.push(w);
  });

  // מי שעדיין אין לה אות קבוצה. **מסונן כמו כל שאר המסך**, כלומר כברירת מחדל
  // מציג את האפליקציה החדשה בלבד.
  //
  // עד v6.69 זה חצה את סינון האפליקציה בכוונה, כי אישה שהתחילה השבוע ועוד לא
  // פתחה את האפליקציה נקראת קג'אבי, והיא בדיוק זו שצריך לשבץ. **הנימוק הזה נפל
  // כשנוספה עמודת "אפליקציית תזונה" בגיליון**, שמסומנת כבר ברישום, ולכן היא
  // מזוהה כאפליקציה החדשה לפני שפתחה אותה אי פעם. רון, 2 בספטמבר 2026: "בחסרות
  // קבוצה יש נשים לא רלוונטיות כי הן לא עם האפליקציה החדשה."
  //
  // ואף אחת לא נעלמת: בחירת "כל האפליקציות" בסינון מחזירה את כולן.
  var missing = pool.filter(function(w){ return w.needsGroup; });
  // אישה שיושבת על יותר משורה אחת בגיליון. **מסונן לפי בורר האפליקציה בלבד**,
  // בדיוק כמו "חסר מייל", כי שניהם יושבים באותו מסך ואינם יכולים לציית לשני
  // סינונים שונים. בורר המחזור והתוכנית אינו חל כאן.

  // הערות שהיא כתבה מתוך האפליקציה, והתשובות שכבר נשלחו אליה. זו הפעולה היחידה
  // במסך הזה שמגיעה למשתתפת עצמה, ולכן היא נפרדת מכל שאר השדות.
  function tabNotes(w, st, openOnly){
    st = st || NOTES[w.email];
    if(!st) return '<div class="empty">טוען...</div>';
    if(st.state==="loading") return '<div class="empty">טוען...</div>';
    if(st.state!=="ok") return '<div class="empty">לא הצלחתי להגיע להערות. <button class="lnk" data-notesretry="'+esc(w.email)+'">נסי שוב</button></div>';
    if(!st.notes.length) return '<div class="empty">היא לא כתבה שום הערה מתוך האפליקציה.</div>';
    var byNote = {};
    st.replies.forEach(function(r){ byNote[r.to] = r; });
    return st.notes.filter(function(n){ return !openOnly || !byNote[n.id]; }).map(function(n){
      var r = byNote[n.id];
      NOTE_TEXT[n.id] = n.text; NOTE_AT[n.id] = n.at; NOTE_SCREEN[n.id] = n.screen || "";
      var tag = String(n.text||"").match(/^\[נכתב ([0-9.]+)\]\s*/);
      var body = tag ? n.text.slice(tag[0].length) : n.text;
      var when = tag ? 'נכתבה ב-'+esc(tag[1])+' · הועברה מהקובץ' : 'נכתבה ב-'+esc(stamp(n.at));
      var head = '<div class="nhead">'+when+(n.screen?' · מהמסך "'+esc(n.screen)+'"':'')+'</div>'+
                 '<div class="ntext">'+esc(body)+'</div>';
      if(r && r.text){
        return '<div class="note-card done">'+head+
          '<div class="nsent"><b>נשלח '+esc(stamp(r.at))+(r.by?' · '+esc(r.by):'')+'</b>'+
            (r.read ? ' · <span class="okread">נקראה '+esc(stamp(r.read))+'</span>' : ' · ממתין שהיא תפתח את האפליקציה')+'</div>'+
          '<div class="nreply">'+esc(r.text)+'</div>'+
        '</div>';
      }
      if(r) return '<div class="note-card done">'+head+'<div class="nsent">סומנה כטופלה '+esc(stamp(r.at))+(r.by?' · '+esc(r.by):'')+', בלי תשובה אליה.</div></div>';
      var sug = bankSuggest(n.text);
      return '<div class="note-card">'+head+
        (BANK === null ? '<div class="nhint" style="margin-top:10px">טוען תשובות מוכנות...</div>' :
         !sug.length ? '<div class="whybox"><b>אין ניסוח מוכן להערה הזאת</b>'+
            (talkWhy(n.text) ? '<span>'+esc(talkWhy(n.text))+'</span>'
                             : '<span>אפשר לכתוב תשובה כאן, או ללחוץ "העתקה לצ\'אט" כדי לדון בה איתי.</span>')+
          '</div>' :
         '<div class="sugbox"><div class="flabel">תשובות מוכנות שמתאימות לשאלה הזאת</div>'+
            sug.map(function(e){
              return '<button class="sug" data-usebank="'+esc(e.id)+'" data-note="'+esc(n.id)+'">'+
                '<b>'+esc(e.q)+'</b><span>'+esc(e.a)+'</span>'+
                '<i class="use">\u2190 להשתמש בתשובה הזאת</i></button>';
            }).join("")+'</div>')+
        '<div class="flabel" style="margin-top:10px">התשובה שהיא תראה באפליקציה</div>'+
        // ניסוח טיוטה. היא נכתבת לתוך התיבה שמתחת, והפקידה עורכת ושולחת. שום דבר
        // ממנה לא מגיע למשתתפת בלי שאדם קרא אותו ולחץ "שלחי לה".
        '<div class="control" style="margin:0 0 8px">'+
          '<button class="btn" data-drafta="'+esc(n.id)+'" data-for="'+esc(w.email)+'">✎ נסחי לי תשובה</button>'+
          '<span class="nhint" id="dw_'+esc(n.id)+'" style="margin:0"></span>'+
        '</div>'+
        '<textarea class="field" rows="3" id="rp_'+esc(n.id)+'" placeholder="כתבי כאן...">'+esc(DRAFT[n.id]||"")+'</textarea>'+
        '<div class="nhint">היא תראה את הטקסט הזה בדיוק כמו שכתבת, בתוך בועת ההערות באפליקציה. <b>אחרי השליחה אי אפשר לבטל.</b></div>'+
        '<div class="control">'+
          '<button class="btn p" data-sendreply="'+esc(n.id)+'" data-for="'+esc(w.email)+'">שלחי לה</button>'+
          '<button class="btn ghost" data-notedone="'+esc(n.id)+'" data-for="'+esc(w.email)+'">סימון כטופל בלי תשובה</button>'+
          '<button class="btn ghost" data-toclaude="'+esc(n.id)+'" data-for="'+esc(w.email)+'">העתקה לצ\'אט</button>'+
        '</div>'+
        '<label class="bankadd"><input type="checkbox" id="bk_'+esc(n.id)+'" checked> לשמור את השאלה והתשובה בבנק, כדי שיוצעו בפעם הבאה</label>'+
      '</div>';
    }).join("");
  }

          '</div>'
        : '<div class="fld" id="fld-until"><span class="flabel">גישה עד</span><span class="fval">'+
            '<b'+(w.expired?' class="expired"':'')+'>'+(w.until?il(w.until):"לא ידוע")+'</b>'+(w.expired?' (הסתיימה)':'')+
            '<button class="btn sm" data-edituntil="'+esc(w.email)+'">✎ שינוי</button>'+
            (w.override?'<button class="btn sm ghost" data-clear="'+esc(w.email)+'">חזרה לגיליון</button>':'')+
          '</span></div>')+
        (w.override?'<div class="manual">שונה ידנית · בגיליון: '+(w.sheetEnd?il(w.sheetEnd):"לא ידוע")+'</div>':'')
      : '<div class="note">היא מנוהלת בקג\'אבי, ולכן <b>תאריך סיום הגישה ונתוני השימוש אינם רלוונטיים כאן</b> ואינם מוצגים. כל השאר נכון גם לגביה, כי הוא נשמר במניצ\'ט ובגיליון.</div>');

  // שורות בגיליון שיש בהן טלפון ואין בהן מייל. הן לא נשים במסך הזה, כי כל מה ששמור
  // אצלנו מתויק תחת המייל, ולכן זה מסך משלו ולא סינון של הרשימה. הפקידה משלימה את
  // הכתובת, היא נכתבת למניצ'ט שממנו הגיליון מיוצא, וגם נשמרת אצלנו מיד כדי שהאישה
  // תוכל להיכנס עוד היום ולא כשהייצוא הבא ירוץ.
  // שני סוגי בעיות בקובץ במסך אחד, כי שניהם אותה עבודה: שורה שצריך לתקן.
  // הם נשארים שני חלקים מופרדים, כי הפעולה בכל אחד שונה לגמרי.
  function probsScreen(nm, dup){
    return '<div class="psec">חסר מייל ('+nm.length+')</div>'+ nomailScreen(nm)+
           '<div class="psec">כפילות בגיליון ('+dup.length+')</div>'+ dupSection(dup);
  }

  // אישה אחת על כמה שורות. **הכל בבלוק ולא בכרטיס**, כי מעבר לכרטיס מוציא
  // מהמסך וזה בדיוק מה שהפריע לרון בתור המענה.
  function dupSection(rows){
    if(!rows.length) return '<div class="empty">'+
      (dupAll.length ? 'אין כפילויות באפליקציה החדשה. יש '+dupAll.length+' בקג\'אבי, ואפשר לראות אותן דרך הסינון שלמעלה.'
                     : 'אין כפילויות. כל אישה יושבת על שורה אחת 🌸')+'</div>';
    return rows.map(function(w){
      var name = ((w.first||"")+" "+(w.last||"")).trim();
      return '<div class="qitem">'+
        '<div class="qwho">'+
          '<b>'+esc(name || w.email)+'</b>'+
          (w.group?'<span class="grp">קבוצה '+esc(w.group)+'</span>':'<span class="grp warnpill">אין קבוצה</span>')+
          (w.newApp?'<span class="grp newpill">אפליקציה חדשה</span>':'<span class="grp oldpill">קג\'אבי</span>')+
          (w.cancelled?'<span class="grp dngpill">ביטלה</span>':'')+
        '</div>'+
        '<div class="qinfo">'+
          '<div><span class="flabel">טלפון</span> <span class="mono">'+esc(w.phone||"אין")+'</span>'+
            (w.phone?' <button class="btn sm" data-copy="'+esc(w.phone)+'">העתקה</button>'+
              ' <a class="btn sm wa" href="https://wa.me/'+esc(w.phone)+'" target="_blank" rel="noopener">וואטסאפ</a>':'')+'</div>'+
          '<div><span class="flabel">מייל</span> <span class="mono">'+esc(w.email)+'</span>'+
            ' <button class="btn sm" data-copy="'+esc(w.email)+'">העתקה</button></div>'+
          '<div><span class="flabel">מחזור</span> '+esc(il(w.start||""))+' · '+esc(dayInProgram(w))+'</div>'+
          dupBox(w)+

  function nomailScreen(rows){
    if(!rows.length) return '<div class="empty">'+
      (noMailAll.length ? 'אין שורות בלי מייל באפליקציה החדשה. יש '+noMailAll.length+' בקג\'אבי, ואפשר לראות אותן דרך הסינון שלמעלה.'
                        : 'אין שורות בלי מייל. הכל תקין 🌸')+'</div>';
    return '<div class="qhead">'+rows.length+' שורות בגיליון עם טלפון ובלי כתובת מייל. '+
        '<b>כל עוד אין מייל היא לא נכנסת לאפליקציה</b>, וכל מה שנשמר עליה מתויק תחת הכתובת.</div>'+
      rows.map(function(r){
        var name = ((r.first||"")+" "+(r.last||"")).trim();
        return '<div class="qitem">'+
          '<div class="qwho">'+
            '<b>'+esc(name || "בלי שם")+'</b>'+
            '<span class="mono">'+esc(r.phone)+'</span>'+
            '<button class="btn sm" data-copy="'+esc(r.phone)+'">העתקה</button>'+
            '<a class="btn sm wa" href="https://wa.me/'+esc(r.phone)+'" target="_blank" rel="noopener">וואטסאפ</a>'+
            (r.group?'<span class="grp">קבוצה '+esc(r.group)+'</span>':'<span class="grp warnpill">אין קבוצה</span>')+
          '</div>'+
          '<div class="qinfo">'+
            '<div><span class="flabel">מחזור</span> '+(r.start?esc(il(r.start)):"<b>אין תאריך התחלה בשורה</b>")+
              (r.end?' · גישה עד '+esc(il(r.end)):'')+'</div>'+
            '<div class="flabel" style="margin-top:8px">כתובת המייל שלה</div>'+
            '<input class="field" dir="ltr" id="nm_'+esc(r.phone)+'" placeholder="name@example.com" autocomplete="off">'+
            '<div class="control">'+
              '<button class="btn p" data-fixmail="'+esc(r.phone)+'">שמירת המייל</button>'+
            '</div>'+
            '<div class="nhint">הכתובת נכתבת למניצ\'ט, ולכן <b>הגיליון יתעדכן מעצמו בייצוא הבא</b>. '+
              'עד אז היא נשמרת גם אצלנו, וזה מה שמאפשר לה להיכנס לאפליקציה כבר עכשיו.'+
              (r.start ? '' : ' <b>בשורה שלה אין תאריך התחלה, ולכן היא עדיין לא תיכנס.</b> את התאריך משלימים במניצ\'ט.')+
            '</div>'+
          '</div>'+
        '</div>';
      }).join("");
  }

  // הוספת משתתפת שאינה בגיליון כלל. **נשמר אצלנו בלבד.** החלטה של רון: שום דבר
  // מכאן אינו נכתב למניצ'ט, כלומר לא נוצרת שם רשומה ואף אוטומציה לא יכולה לרוץ.
  // ברגע שהייצוא כן יביא אותה, השורה שבגיליון היא זו שעל המסך והרשומה כאן מפסיקה
  // להישאל. חלון הגישה הוא הרגיל: תאריך ההתחלה, ועוד 70 יום ועוד שלושה חודשים.
  function addScreen(){
    var days = freezeSundays();
    return '<div class="qitem">'+
      '<div class="qhead" style="margin:0 0 12px">הוספת משתתפת שאינה בגיליון</div>'+
      '<div class="qinfo">'+
        '<div class="flabel">שם פרטי</div><input class="field" id="ad_first" autocomplete="off">'+
        '<div class="flabel" style="margin-top:8px">שם משפחה</div><input class="field" id="ad_last" autocomplete="off">'+
        '<div class="flabel" style="margin-top:8px">טלפון (אפשר להשאיר ריק)</div>'+
        '<input class="field" dir="ltr" id="ad_phone" placeholder="972501234567" autocomplete="off">'+
        '<div class="flabel" style="margin-top:8px">כתובת מייל</div>'+
        '<input class="field" dir="ltr" id="ad_email" placeholder="name@example.com" autocomplete="off">'+
        '<div class="flabel" style="margin-top:8px">מחזור</div>'+
        '<select class="field" id="ad_start">'+
          days.map(function(d){
            var tag = d === weekSundays().cur ? " · השבוע הנוכחי" : (d < DATA.today ? " · כבר עבר" : "");
            return '<option value="'+esc(d)+'"'+(d===weekSundays().cur?" selected":"")+'>'+esc(il(d))+esc(tag)+'</option>';
          }).join("")+
        '</select>'+
        '<div class="flabel" style="margin-top:8px">קבוצה (אפשר להשאיר ריק)</div>'+
        '<select class="field" id="ad_group">'+
          '<option value="">ללא קבוצה</option>'+
          ["א","ב","ג","ד","ה"].map(function(g){ return '<option value="'+g+'">קבוצה '+g+'</option>'; }).join("")+
        '</select>'+
        '<div class="control"><button class="btn p" id="ad_save">הוספה</button></div>'+
        '<div class="nhint"><b>נשמר אצלנו בלבד.</b> שום דבר לא נכתב למניצ\'ט ולא לגיליון, ולכן אף '+
          'אוטומציה לא תרוץ ואף הודעה לא תישלח אליה. היא תוכל להיכנס לאפליקציה מיד, וברגע '+
          'שהיא תופיע בגיליון הנתונים משם הם שיוצגו.</div>'+
      '</div>'+
    '</div>';
  }

  // תור המענה. כל הערה פתוחה, עם שם האישה מעליה, אחת מתחת לשנייה. עונים לאחת והיא
  // נעלמת מהתור, והבאה כבר על המסך. אין חזרה לרשימה ואין כניסה לכרטיס.
  function queueScreen(){
    if(BANK === null) bankLoad();
    if(QUEUE === null){ queueLoad(); return '<div class="empty">טוען...</div>'; }
    if(QUEUE === "loading") return '<div class="empty">טוען...</div>';
    if(QUEUE === "failed") return '<div class="empty">לא הצלחתי להגיע להערות. <button class="lnk" data-queueretry="1">נסי שוב</button></div>';
    var byMail = {};
    (DATA.women||[]).forEach(function(w){ byMail[w.email] = w; });
    var rows = [];
    Object.keys(QUEUE).forEach(function(em){
      var w = byMail[em] || { email: em, first: "", last: "" };
      var st = { state:"ok", notes: QUEUE[em].notes || [], replies: QUEUE[em].replies || [] };
      var answered = {};
      st.replies.forEach(function(r){ answered[r.to] = 1; });
      (st.notes || []).forEach(function(n){
        if(answered[n.id]) return;
        rows.push({ at: n.at || "", html:
          '<div class="qitem">'+
            '<div class="qwho">'+
              '<button class="lnk" data-open="'+esc(em)+'">'+esc(((w.first||"")+" "+(w.last||"")).trim() || em)+'</button>'+
              // מתי היא כתבה, על השורה של השם ולפני שפותחים כלום: זה מה שאומר מי קדמה למי.
              '<span class="qwhen">'+esc(noteWhen(n))+'</span>'+
              (w.group?'<span class="grp">קבוצה '+esc(w.group)+'</span>':'<span class="grp warnpill">אין קבוצה</span>')+
              '<button class="btn sm" data-qinfo="'+esc(em)+'">'+(QINFO[em]?"סגירת הפרטים":"פרטים")+'</button>'+
              (w.phone?'<a class="btn sm wa" href="https://wa.me/'+esc(w.phone)+'" target="_blank" rel="noopener">וואטסאפ</a>':'')+
            '</div>'+
            (QINFO[em] ? '<div class="qinfo">'+
              '<div><span class="flabel">טלפון</span> <span class="mono">'+esc(w.phone||"אין")+'</span>'+
                (w.phone?' <button class="btn sm" data-copy="'+esc(w.phone)+'">העתקה</button>':'')+'</div>'+
              '<div><span class="flabel">מייל</span> <span class="mono">'+esc(w.email||"")+'</span>'+
                ' <button class="btn sm" data-copy="'+esc(w.email||"")+'">העתקה</button></div>'+
              '<div><span class="flabel">מחזור</span> '+esc(il(w.start||""))+' · '+esc(dayInProgram(w))+' · '+esc(lastSeen(w))+'</div>'+
              (function(){
                // כל מה שכבר נענה לה, כאן ולא בכרטיס: רון ביקש שהכל יהיה נגיש מהמסך הזה.
                var prev = (QUEUE[em].notes || []).map(function(x){ return { n:x, r: (QUEUE[em].replies||[]).filter(function(y){ return y.to === x.id; })[0] }; })
                  .filter(function(x){ return x.r; });
                if(!prev.length) return '<div class="qprev-none">אין עדיין התכתבות קודמת איתה.</div>';
                return '<div class="qprev"><span class="flabel">ההתכתבות עד היום ('+prev.length+')</span>'+
                  prev.map(function(x){
                    return '<div class="qprev-i">'+
                      '<div class="qprev-q">'+esc(noteWhen(x.n))+' · '+esc(String(x.n.text||"").replace(/^\[נכתב [^\]]*\]\s*/, ""))+'</div>'+
                      (x.r.text
                        ? '<div class="qprev-a">'+esc(x.r.text)+'</div>'+
                          '<div class="qprev-m">נשלח '+esc(stamp(x.r.at))+(x.r.by?' · '+esc(x.r.by):'')+
                            (x.r.read ? ' · <span class="okread">נקראה '+esc(stamp(x.r.read))+'</span>' : ' · ממתין שהיא תפתח את האפליקציה')+'</div>'
                        : '<div class="qprev-m">סומנה כטופלה '+esc(stamp(x.r.at))+(x.r.by?' · '+esc(x.r.by):'')+', בלי תשובה אליה.</div>')+
                    '</div>';
                  }).join("")+'</div>';
              })()+
            '</div>' : '')+
            tabNotes(w, { state:"ok", notes:[n], replies: st.replies }, true)+
          '</div>' });
      });
    });
    if(!rows.length) return '<div class="empty">אין הערות שממתינות לתשובה. הכל טופל 🌸</div>';
    rows.sort(function(a,b){ return String(b.at).localeCompare(String(a.at)); });
    return '<div class="qhead">'+rows.length+' הערות ממתינות לתשובה. עונים לאחת, היא יורדת מהתור, והבאה כאן.</div>'+
      rows.map(function(r){ return r.html; }).join("");
  }

  function quickActs(w){
    var opts = [["fld-coh","העברת מחזור"],["fld-grp","שיוך קבוצה"],
      ["fld-frz", w.freeze ? ((w.frozen && w.freezeTodo) ? "השלמת ההקפאה" : "עדכון ההקפאה") : "הכנסה להקפאה"]];
    if(w.newApp) opts.push(["fld-until","הארכת גישה"]);
    opts.push(["fld-name","שינוי השם"]);
    opts.push(["fld-mail","שינוי כתובת מייל"]);
    opts.push(["fld-cancel","ביטול בתהליך"]);
    var need = (!w.group && !w.frozen) || (w.frozen && w.freezeTodo);
    return '<div class="dacts">'+
      '<select class="field sm qsel'+(need?" need":"")+'" id="qa_'+esc(w.email)+'" data-qa="'+esc(w.email)+'">'+
        '<option value="">פעולות מהירות ⌄</option>'+
        opts.map(function(o){ return '<option value="'+o[0]+'">'+o[1]+'</option>'; }).join("")+
      '</select>'+
      (w.phone?'<a class="qa wa" href="https://wa.me/'+esc(w.phone)+'" target="_blank" rel="noopener">'+I_WA+'וואטסאפ</a>':'')+
    '</div>';
  }

  // הקופסה שאומרת בדיוק מה כפול. בלעדיה שתי שורות נראות בדיוק כמו שורה אחת, וזה
  // מה שגרם למסך להציג מחזור אחד ולאפליקציה לתת לה מחזור אחר.
  function dupBox(w){
    var out = "";
    if(w.dupRows > 1){
      var st = (w.dupStarts||[]).map(function(d){ return d ? il(d) : "בלי תאריך"; });
      out += '<div class="dupbox"><b>המייל הזה מופיע ב-'+w.dupRows+' שורות בגיליון</b>'+
        'תאריכי ההתחלה בשורות: '+esc(st.join(" · "))+'. המסך והאפליקציה משתמשים ב-'+esc(il(w.sheetStart||""))+'.'+
        (w.cancelled?' <b>אחת השורות מסומנת ביטלה, ולכן היא חסומה.</b>':'')+'</div>';
    }
    if(w.dupPhone && w.dupPhone.length){
      out += '<div class="dupbox"><b>הטלפון הזה מופיע גם על כתובת מייל אחרת</b>'+
        esc(w.dupPhone.join(" · "))+'. שתיהן מוצגות כאן כשתי משתתפות נפרדות, ולכל אחת מחזור וגישה משלה. '+
        'כתיבה למניצ\'ט מכאן מגיעה לרשומה אחת בלבד מבין השתיים.</div>';
    }
    return out;
  }

  function womanCard(w){
    var nm = ((w.first||"")+" "+(w.last||"")).trim() || w.email;
    var body = TAB==="notes"  ? tabNotes(w)
             : TAB==="cohort" ? tabCohort(w)
             : TAB==="perm"   ? tabPerm(w)
             : TAB==="usage"  ? (w.newApp ? usagePanel(w) : '<div class="empty">היא מנוהלת בקג\'אבי, ואין לנו נתוני שימוש עליה.</div>')
             : TAB==="log"    ? logLines(w)
             : tabInfo(w);
    return '<div class="card open">'+
      '<button class="btn back" data-back="1">→ חזרה לרשימה</button>'+
      '<div class="dhead">'+
        '<div class="row1"><span class="nm">'+esc(nm)+'</span>'+
        (w.group?'<span class="grp">קבוצה '+esc(w.group)+(w.groupOverride?" ✎":"")+'</span>':'<span class="grp warnpill">אין קבוצה</span>')+
        (w.newApp?'<span class="grp newpill">אפליקציה חדשה</span>':'<span class="grp oldpill">קג\'אבי</span>')+
      progPill(w)+
        (w.cancelled?'<span class="grp dngpill">ביטלה</span>':'')+
        (w.frozen?'<span class="grp coldpill">בהקפאה</span>':'')+
        (w.blocked?'<span class="grp dngpill">'+(w.newApp?'חסומה מהאפליקציה':'בביטול · לבטל בקג\'אבי')+'</span>':'')+'</div>'+
        '<div class="meta">מחזור '+il(w.start)+(w.startOverride?" ✎":"")+' · '+dayInProgram(w)+' · '+lastSeen(w)+
          (w.newApp?' · גישה עד <b class="'+(w.expired?"expired":"")+'">'+(w.until?il(w.until):"לא ידוע")+'</b>'+(w.expired?" (הסתיימה)":""):"")+'</div>'+
        ((w.backSoon && w.backCohort)?'<div class="workline">חוזרת '+il(w.freeze.back)+' לשבוע '+w.freeze.week+' · <b>להכניס לקבוצה של מחזור '+il(w.backCohort)+'</b></div>':'')+
        dupBox(w)+
        quickActs(w)+
      '</div>'+
      '<div class="tabs" role="tablist">'+TABS.map(function(t){
        var badge = (t[0]==="notes" && w.notes) ? '<i class="tbadge">'+w.notes+'</i>' : '';
        return '<button class="tab" data-tab="'+t[0]+'" aria-selected="'+(TAB===t[0])+'" role="tab">'+t[1]+badge+'</button>';
      }).join("")+'</div>'+
      '<div class="tabwrap">'+body+'</div>'+
    '</div>';
  }

  // שורה ברשימה: השם, מה שדורש טיפול, ומספיק כדי לזהות אותה. הכל היתר בכרטיס.
  function womanRow(w){
    var nm = ((w.first||"")+" "+(w.last||"")).trim() || w.email;
    return '<button class="lrow'+(SEL===w.email?" on":"")+'" data-open="'+esc(w.email)+'">'+
      '<span class="row1"><span class="nm">'+esc(nm)+'</span>'+
      (w.group?'<span class="grp">קבוצה '+esc(w.group)+(w.groupOverride?" ✎":"")+'</span>':'<span class="grp warnpill">אין קבוצה</span>')+
      (w.newApp?'<span class="grp newpill">אפליקציה חדשה</span>':'<span class="grp oldpill">קג\'אבי</span>')+
      progPill(w)+
      (w.cancelled?'<span class="grp dngpill">ביטלה</span>':'')+
      (w.frozen?'<span class="grp coldpill">בהקפאה</span>':'')+
      (w.blocked?'<span class="grp dngpill">'+(w.newApp?'חסומה מהאפליקציה':'בביטול · לבטל בקג\'אבי')+'</span>':'')+
      (w.notes?'<span class="grp notepill">'+(w.notes>1?w.notes+' הערות ממתינות':'הערה ממתינה')+'</span>':'')+
      ((w.dupRows>1||(w.dupPhone&&w.dupPhone.length))?'<span class="grp warnpill">כפילות בגיליון</span>':'')+
      '</span>'+
      '<span class="meta">מחזור '+il(w.start)+(w.startOverride?" ✎":"")+' · '+dayInProgram(w)+' · '+lastSeen(w)+'</span>'+
      ((w.backSoon && w.backCohort)?'<span class="workline">חוזרת '+il(w.freeze.back)+' לשבוע '+w.freeze.week+' · <b>להכניס לקבוצה של מחזור '+il(w.backCohort)+'</b></span>':'')+
      ((w.frozen && w.freezeTodo)?'<span class="workline">בהקפאה · '+esc(w.freezeTodo)+'</span>':'')+
      '</button>';
  }

  var sel = list.filter(function(w){ return w.email === SEL; })[0]
         || DATA.women.filter(function(w){ return w.email === SEL; })[0];

  if(VIEW === "probs" && !searching){
    html += probsScreen(noMail, dupList);
    app.innerHTML = html;
    wire();
    return;
  }

  if(VIEW === "add" && !searching){
    html += addScreen();
    app.innerHTML = html;
    wire();
    return;
  }

  if(VIEW === "notes" && !searching){
    html += queueScreen();
    html += '<div class="note">שינוי כאן נשמר אצלנו וגובר על הגיליון. <b>הגיליון הראשי לא משתנה</b>, כי הוא הקובץ ש-ManyChat עובד איתו.</div>';
    app.innerHTML = html;
    wire();
    return;
  }

  html += '<div class="split'+(sel?" haspick":"")+'">'+
    '<div class="pane list">'+
      '<div class="phead"><span>'+list.length+' משתתפות</span><span>ממוינות לפי שם</span></div>'+
      (list.length
        // תקרה על הציור בלבד, כי הרשימה נבנית מחדש בכל הקשה בחיפוש. מה שנחתך נאמר
        // במפורש, כי היעדר שורה אינו תשובה.
        ? list.slice(0, 300).map(womanRow).join("")+
          (list.length > 300 ? '<div class="note" style="padding:12px 15px;margin:0">מוצגות 300 הראשונות מתוך '+list.length+'. <b>אפשר לבחור מחזור או לחפש שם או טלפון</b> כדי להגיע לשאר.</div>' : '')
        : '<div class="empty">'+(MISSING ? "אין כאן נשים ללא קבוצה. הכל משויך." : searching ? searchMiss(q) : "לא נמצאה אף משתתפת")+'</div>')+
    '</div>'+
    '<div class="pane detail">'+
      (sel ? womanCard(sel) : '<div class="empty">בחרי משתתפת מהרשימה כדי לראות את הכרטיס שלה.</div>')+
    '</div>'+
  '</div>';

  html += '<div class="note">שינוי כאן נשמר אצלנו וגובר על הגיליון. <b>הגיליון הראשי לא משתנה</b>, כי הוא הקובץ ש-ManyChat עובד איתו.</div>';
  app.innerHTML = html;

      .catch(function(){ alert("הביטול נכשל. נסי שוב."); el.disabled=false; });
  }; });
  app.querySelectorAll("[data-freeze]").forEach(function(el){ el.onclick=function(){
    FREEZING = el.getAttribute("data-freeze"); render(); }; });
  app.querySelectorAll("[data-nofreeze]").forEach(function(el){ el.onclick=function(){
    FREEZING = ""; render(); }; });
  app.querySelectorAll("[data-savefreeze]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-savefreeze");
    var back=document.getElementById("fb_"+em).value;
    var week=document.getElementById("fw_"+em).value;
    // Either half may be unknown. Without both there is nothing to compute, so she simply
    // stays frozen and stays on the list until the office fills the rest in.
    if(!confirm((back && week)
      ? "להכניס אותה להקפאה?\n\nהיא חוזרת ביום ראשון "+il(back)+", לשבוע "+week+".\nעד אז היא לא נכנסת לאפליקציה ולא מקבלת תזכורות.\n\nבמניצ'ט ייכתבו תאריך ההתחלה המחושב והתגית \"הקפאה\", ואם יש שם אוטומציות שמחוברות אליהן הן יפעלו."
      : "להכניס אותה להקפאה בלי כל הפרטים?\n\n"+(back?"יש תאריך חזרה, חסר השבוע.":week?"יש שבוע, חסר תאריך החזרה.":"חסרים גם תאריך החזרה וגם השבוע.")+"\n\nהיא לא נכנסת לאפליקציה ולא מקבלת תזכורות עד שתשלימי, והיא תופיע ברשימת \"הקפאה להשלמה\".\nהתגית \"הקפאה\" תיכתב במניצ'ט כבר עכשיו.")) return;
    el.disabled=true; el.textContent="שומרת...";
    save(em,{freeze:{back:back, week:week}}).then(function(r){
      if(!r.ok) throw new Error();
      if(back && week && r.mc && String(r.mc).indexOf("ok:")===0) alert("נשמר. במניצ'ט עכשיו: "+String(r.mc).slice(3));
      else if(String(r.mc||"").indexOf("startfail:")===0) alert("ההקפאה נשמרה אצלנו, אבל תאריך ההתחלה לא נכתב במניצ'ט.\n\nמניצ'ט אמר: "+String(r.mc).slice(10));
      else mcWarn(r);
      FREEZING=""; delete MC[em]; return load().then(function(){ render(); mcLoad(em); });
    }).catch(function(){ alert("השמירה נכשלה. נסי שוב."); el.disabled=false; el.textContent="שמירה"; });
  }; });
  app.querySelectorAll("[data-unfreeze]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-unfreeze");
    if(!confirm("לסיים לה את ההקפאה?\n\nהיא תחזור להיכנס לאפליקציה מיד.\nתאריך ההתחלה שנקבע לה נשאר כמו שהוא.\n\nהתגית \"הקפאה\" תוסר במניצ'ט, ואם יש שם אוטומציה שמחוברת להסרה היא תפעל.")) return;
    el.disabled=true;
    save(em,{freeze:{off:true}}).then(function(r){ if(!r.ok) throw new Error(); mcWarn(r); FREEZING=""; delete MC[em]; return load().then(function(){ render(); mcLoad(em); }); })
      .catch(function(){ alert("הפעולה נכשלה. נסי שוב."); el.disabled=false; });
  }; });
  app.querySelectorAll("[data-saveemail]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-saveemail"), box=document.getElementById("e_"+em);
    var to=(box?box.value:"").trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){ alert("צריך להזין כתובת מייל תקינה"); return; }
    if(to===em){ alert("זו אותה כתובת."); return; }
    if(!confirm("לשנות לה את כתובת המייל?\n\nמ: "+em+"\nל: "+to+"\n\nהכתובת תיכתב במניצ'ט, וכל מה ששמור אצלנו עליה יעבור לכתובת החדשה.\nמהכניסה הבאה היא נכנסת רק עם הכתובת החדשה.")) return;
    el.disabled=true; el.textContent="משנה...";
    fetch("/api/admin?key="+encodeURIComponent(KEY),{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({email:em, newEmail:to, phone:phoneOf(em), by:WHO})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok){ alert("הכתובת שונתה. מעכשיו היא נכנסת עם "+to+" בלבד.\n\nהגיליון יתעדכן לבד בייצוא הבא של מניצ'ט, ועד אז הכרטיס יציג את שתי הכתובות."); EDITING=""; delete MC[em]; return load().then(render); }
        // Nothing was moved on our side when ManyChat refused, so the two never drift apart.
        var why = d && d.error === "email_taken" ? "הכתובת הזאת כבר קיימת אצל מישהי אחרת בגיליון."
                : d && d.error === "mc_off" ? "החיבור למניצ'ט אינו מוגדר, ולכן לא שיניתי כלום."
                : d && String(d.mc||"").indexOf("emailfail:")===0 ? "מניצ'ט לא קיבל את השינוי: "+String(d.mc).slice(10)
                : d && d.mc === "not_found" ? "לא נמצאה רשומה במניצ'ט לפי הטלפון שלה."
                : "השינוי נכשל.";
        alert(why+"\n\nשום דבר לא שונה.");
        el.disabled=false; el.textContent="שינוי כתובת";
      }).catch(function(){ alert("השינוי נכשל. נסי שוב."); el.disabled=false; el.textContent="שינוי כתובת"; });
  }; });
  app.querySelectorAll("[data-savestart]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-savestart"), v=document.getElementById("s_"+em).value;
    if(!v){ alert("צריך לבחור תאריך"); return; }
    if(!confirm("לשנות את תאריך ההתחלה?\n\nהיא תעבור למחזור של "+il(v)+".\nזה משנה לה את היום בתוכנית, את התכנים שייפתחו לה, ואת תאריך סיום הגישה.\nהשינוי נכתב גם למניצ'ט.")) return;
    el.disabled=true; el.textContent="שומרת...";
    save(em,{start:v}).then(function(r){
      if(!r.ok) throw new Error();
      // What ManyChat actually stored, echoed back rather than assumed. A datetime field
      // there has a shape of its own, and this is the only way to see it for certain.
      if(r.mc && r.mc.indexOf("ok:")===0) alert("נשמר. במניצ'ט עכשיו: "+r.mc.slice(3));
      else if(r.mc && r.mc.indexOf("startfail:")===0) alert("התאריך נשמר אצלנו וחל על האפליקציה, אבל במניצ'ט הוא לא נכתב.\n\nמניצ'ט אמר: "+r.mc.slice(10)+"\n\nכלומר הגיליון והאוטומציות שם לא יודעים על השינוי.");
      else mcWarn(r);
      // The panel stays open and the ManyChat line is re-read, so what is on screen is what
      // is really there rather than what was there before the change.
      delete MC[em]; return load().then(function(){ render(); mcLoad(em); });
    }).catch(function(){ alert("השמירה נכשלה. נסי שוב."); el.disabled=false; el.textContent="שמירת תאריך ההתחלה"; });
  }; });
  app.querySelectorAll("[data-clearstart]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-clearstart");
    if(!confirm("להחזיר את תאריך ההתחלה לערך שבגיליון?\n\nזה מבטל את השינוי אצלנו בלבד. מה שנכתב במניצ'ט נשאר שם.")) return;
    el.disabled=true;
    save(em,{start:""}).then(function(r){ if(!r.ok) throw new Error(); EDITING=""; return load().then(render); })
      .catch(function(){ alert("הפעולה נכשלה. נסי שוב."); el.disabled=false; });
  }; });
  app.querySelectorAll("[data-savegroup]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-savegroup"), g=document.getElementById("g_"+em).value;
    el.disabled=true; el.textContent="שומרת...";
    save(em,{group:g}).then(function(r){ if(!r.ok) throw new Error(); mcWarn(r); delete MC[em]; EDITING=""; return load().then(render); })
      .catch(function(){ alert("השמירה נכשלה. נסי שוב."); el.disabled=false; el.textContent="שמירת קבוצה"; });
  }; });
  // The bonus lessons, written to both places at once: our own store, so it applies on her
  // next load instead of waiting minutes for Google's published sheet to refresh, and the
  // matching ManyChat tag, which is where the sheet column comes from in the first place.
  // The panel stays open, because the clerk wants to see the new state where she pressed.
  app.querySelectorAll("[data-dpart]").forEach(function(el){ el.onchange=function(){
    dateSync(el.getAttribute("data-dpart")); }; });
  app.querySelectorAll("[data-edituntil]").forEach(function(el){ el.onclick=function(){
    UNTILING = el.getAttribute("data-edituntil"); render(); }; });
  app.querySelectorAll("[data-nountil]").forEach(function(el){ el.onclick=function(){
    UNTILING = ""; render(); }; });
  app.querySelectorAll("[data-editname]").forEach(function(el){ el.onclick=function(){
    NAMING = el.getAttribute("data-editname"); render(); }; });
  app.querySelectorAll("[data-noname]").forEach(function(el){ el.onclick=function(){
    NAMING = ""; render(); }; });
  app.querySelectorAll("[data-savename]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-savename");
    var fn=(document.getElementById("fn_"+em).value||"").trim();
    var ln=(document.getElementById("ln_"+em).value||"").trim();
    if(!fn && !ln){ alert("צריך למלא לפחות שם אחד"); return; }
    if(!confirm("לשנות את השם ל-"+((fn+" "+ln).trim())+"?\n\nהשם נכתב גם למניצ'ט, ומשם הוא מגיע לגיליון ולהודעות שיוצאות אליה.")) return;
    el.disabled=true; el.textContent="שומרת...";
    save(em,{first:fn, last:ln}).then(function(r){
      if(!r.ok) throw new Error();
      if(r.mc && r.mc.indexOf("namefail:")===0) alert("השם שונה אצלנו, אבל במניצ'ט הוא לא נכתב.\n\nמניצ'ט אמר: "+r.mc.slice(9)+"\n\nכלומר הגיליון וההודעות שם ממשיכים עם השם הישן.");
      else mcWarn(r);
      NAMING = "";
      return load().then(render);
    }).catch(function(){ alert("לא הצלחתי לשמור."); el.disabled=false; el.textContent="שמירה"; });
  }; });
  app.querySelectorAll("[data-glowtag]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-glowtag");
    if(!confirm("לאפס את הסימון של תיוג Glow עבור "+em+"?\n\nזה מוחק רק את הסימון אצלנו שאומר שכבר תויגה, כדי שאפשר יהיה לבדוק שוב.\nהתג במניצ'ט לא מוסר.")) return;
    el.disabled=true; el.textContent="מאפסת...";
    save(em,{glowtag:1}).then(function(r){ if(!r.ok) throw new Error(); alert("הסימון אופס. בכניסה הבאה שלה לאפליקציה, אם היא צפתה, היא תתויג שוב."); return load().then(render); })
      .catch(function(){ alert("לא הצלחתי לאפס."); el.disabled=false; el.textContent="איפוס תיוג Glow"; });
  }; });

  app.querySelectorAll("[data-glow]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-for"), v=el.getAttribute("data-glow");
    el.disabled=true;
    save(em,{glow:v}).then(function(r){
      if(!r.ok) throw new Error();
      mcWarn(r);
      return load().then(function(){ mcLoad(em); });
    }).catch(function(){ alert("הפעולה נכשלה. נסי שוב."); el.disabled=false; });
  }; });
  app.querySelectorAll("[data-cleargroup]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-cleargroup");
    el.disabled=true;
    save(em,{group:""}).then(function(r){ if(!r.ok) throw new Error(); EDITING=""; return load().then(render); })
      .catch(function(){ alert("הפעולה נכשלה. נסי שוב."); el.disabled=false; });
  }; });
  app.querySelectorAll("[data-clear]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-clear");
    el.disabled=true;
    save(em,{until:""}).then(function(r){ if(!r.ok) throw new Error(); EDITING=""; UNTILING=""; return load().then(render); })
      .catch(function(){ alert("הפעולה נכשלה. נסי שוב."); el.disabled=false; });
  }; });
}

function boot(){
  if(!KEY){ askKey(); return; }
  app.innerHTML = '<div class="empty">טוען...</div>';
  load().then(render).catch(function(e){
    if(String(e.message)==="unauthorized"){ KEY=""; try{ localStorage.removeItem("mp_admin_key"); }catch(x){} askKey("המפתח שגוי. נסי שוב."); }
    else app.innerHTML = '<div class="empty">לא הצלחתי לטעון את הנתונים. נסי לרענן.</div>';
  });
}

try{ KEY = localStorage.getItem("mp_admin_key")||""; WHO = localStorage.getItem("mp_admin_who")||""; }catch(e){}
var m = location.search.match(/[?&]key=([^&]+)/);
if(m){ KEY = decodeURIComponent(m[1]); try{ localStorage.setItem("mp_admin_key",KEY); }catch(e){} history.replaceState(null,"",location.pathname); }
boot();
</script>
</body>
</html>
