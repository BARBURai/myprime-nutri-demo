<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ניהול משתתפות · מיי פריים 360</title>
<style>
  :root{--bg:#faf7f8;--card:#fff;--ink:#2d2430;--soft:#2d2430;--line:#ece4ee;--pink:#c2185b;--pinkbg:#fce4ec;--ok:#2e7d32;--warn:#b26a00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Arial,sans-serif;padding:env(safe-area-inset-top) 0 40px}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:8px 0 4px}
  .sub{color:var(--soft);font-size:14px;margin-bottom:16px}
  input,select,button{font:inherit}
  .field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .field:focus{outline:2px solid var(--pink);outline-offset:1px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--soft);cursor:pointer}
  .chip.on{background:var(--pinkbg);border-color:var(--pink);color:var(--pink);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .row1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .nm{font-weight:700;font-size:17px}
  .grp{background:var(--pinkbg);color:var(--pink);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
  .meta{color:var(--soft);font-size:14px;margin-top:4px;word-break:break-word}
  .until{margin-top:8px;font-size:15px}
  .manual{color:var(--warn);font-size:13px;margin-top:2px}
  .log{font-size:12.5px;margin-top:4px;line-height:1.6}
  .expired{color:var(--pink);font-weight:600}
  .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .btn.p{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
  .edit{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{color:var(--soft);font-size:13px;margin-top:14px}
  .lbl{font-size:13px;color:var(--soft);margin-top:10px}
  .chip.warn{border-color:var(--warn);color:var(--warn);font-weight:600}
  .chip.warn.on{background:#fff4e5}
  .warnpill{background:#fff4e5;color:var(--warn)}
  .newpill{background:#e6f4ea;color:#1b5e20}
  .oldpill{background:#eee;color:#555}
  .btn.sm{padding:6px 10px;font-size:13px}
  .field.sm{padding:6px 8px;font-size:14px;width:auto}
  .adds{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .stats{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .statline{font-size:14px;margin-bottom:4px}
  .bars{display:flex;gap:3px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
  .bar{flex:0 0 auto;width:16px;text-align:center}
  .barbox{height:90px;display:flex;align-items:flex-end;background:var(--line);border-radius:3px}
  .barfill{width:100%;background:var(--pink);border-radius:3px}
  .barlbl{font-size:10px;margin-top:2px}
  .empty{text-align:center;color:var(--soft);padding:40px 0}
  a{color:var(--pink)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">טוען...</div></div>

<script>
// Office tool. Everything here reads the registration sheet and writes ONLY to our own
// store: a change made here never touches that file, because ManyChat and the access gate
// both depend on it. The screen therefore always shows the sheet's value next to a manual
// change rather than replacing it.
var KEY = "", WHO = "", DATA = null, APP = "new", YEAR = null, MONTH = null, COHORT = "", GROUP = "", SHOWCANCELLED = false, MISSING = false, EDITING = "";
var HEB_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function monthLabel(ym){ var p = ym.split("-"); return HEB_MONTHS[parseInt(p[1],10)-1]+" "+p[0]; }
var STATS = "", STATSMODE = "day";   // which card has its usage panel open, and at what zoom
// Which women still need a group letter is decided in api/admin.js (needsGroup), so the
// rule has one home and the offline check covers it.
var app = document.getElementById("app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function il(d){ if(!d) return ""; var p=d.split("-"); return p[2]+"."+p[1]+"."+p[0]; }
// Cohorts start on a Sunday, so "this week's" cohort is the most recent Sunday and the next
// one is seven days later. Naming them saves the clerk working it out from a date.
function weekSundays(){
  var t = new Date(DATA.today+"T00:00:00Z");
  t.setUTCDate(t.getUTCDate() - t.getUTCDay());       // Sunday of the current week
  var cur = t.toISOString().slice(0,10);
  t.setUTCDate(t.getUTCDate() + 7);
  return { cur: cur, next: t.toISOString().slice(0,10) };
}
function cohortLabel(d){
  if(!DATA) return il(d);
  var w = weekSundays();
  if(d === w.cur) return "מחזור נוכחי · "+il(d);
  if(d === w.next) return "המחזור הבא · "+il(d);
  return il(d);
}
function stamp(iso){ if(!iso) return ""; var d=new Date(iso); if(isNaN(d)) return "";
  var p=function(n){return (n<10?"0":"")+n;};
  return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function days(a,b){ return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000); }

function dayInProgram(w){
  if(!w.start||!DATA) return "";
  var n = days(w.start, DATA.today)+1;
  if(n<1) return "טרם התחילה";
  // The same reading the woman sees in her own tracker: cohorts start on a Sunday, so day 1
  // is Sunday and day 7 is Saturday. Past day 70 the programme is over and there is no
  // week 11, so the plain day number is the honest answer.
  if(n>70) return "יום "+n+" · אחרי סיום התוכנית";
  return "שבוע "+(Math.floor((n-1)/7)+1)+" יום "+(((n-1)%7)+1);
}
function lastSeen(w){
  if(!w.seen) return "עוד לא נכנסה";
  var n = days(w.seen, DATA.today);
  if(n<=0) return "נכנסה היום";
  if(n===1) return "נכנסה אתמול";
  return "נכנסה לפני "+n+" ימים";
}

// Her progress, drawn from counts only. Programme day N maps to week/day the same way the
// tracker does: cohorts start on Sunday, so day 1 is Sunday and day 7 is Saturday.
function usageBars(u, mode){
  var out = [];
  if(mode === "week"){
    for(var wk=1; wk<=10; wk++){
      var got=0, tot=0;
      for(var dy=1; dy<=7; dy++){
        var p = u.days[wk+"-"+dy];
        if(p){ got += p[0]; tot += p[1]; }
      }
      if(tot) out.push({ label:"ש"+wk, pct: Math.round(got*100/tot), title:"שבוע "+wk+": "+got+" מתוך "+tot });
    }
    return out;
  }
  for(var n=1; n<=70; n++){
    var w2 = Math.floor((n-1)/7)+1, d2 = ((n-1)%7)+1;
    var pair = u.days[w2+"-"+d2];
    if(!pair) continue;
    out.push({ label:String(n), pct: Math.round(pair[0]*100/pair[1]),
               title:"שבוע "+w2+" יום "+d2+": "+pair[0]+" מתוך "+pair[1] });
  }
  return out;
}

function usagePanel(w){
  var u = w.usage;
  if(!u) return '<div class="stats"><div class="meta">אין עדיין נתוני שימוש. הם נאספים בפעם הבאה שהיא תפתח את האפליקציה.</div></div>';
  var tot=0, got=0;
  Object.keys(u.days||{}).forEach(function(k){ got += u.days[k][0]; tot += u.days[k][1]; });
  var bars = usageBars(u, STATSMODE);
  return '<div class="stats">'+
    '<div class="statline"><b>'+(tot?Math.round(got*100/tot):0)+'%</b> מהתכנים · '+
      '<b>'+u.videosDone+'</b> מתוך '+u.videosTotal+' סרטונים · '+
      '<b>'+u.trackerDays+'</b> ימי יומן מעקב · '+
      '<b>'+u.views+'</b> צפיות בסרטונים</div>'+
    '<div class="chips"><span class="chip'+(STATSMODE==="day"?" on":"")+'" data-sm="day">לפי יום</span>'+
      '<span class="chip'+(STATSMODE==="week"?" on":"")+'" data-sm="week">לפי שבוע</span></div>'+
    (bars.length
      ? '<div class="bars">'+bars.map(function(b){
          return '<div class="bar" title="'+esc(b.title)+'">'+
            '<div class="barbox"><div class="barfill" style="height:'+Math.max(b.pct,2)+'%"></div></div>'+
            '<div class="barlbl">'+esc(b.label)+'</div></div>';
        }).join("")+'</div>'
      : '<div class="meta">עוד לא צפתה בשום תוכן.</div>')+
    '</div>';
}

function save(email, patch){
  var body = { email: email, by: WHO };
  for(var k in patch) body[k] = patch[k];
  return fetch("/api/admin?key="+encodeURIComponent(KEY),{
    method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}

function load(){
  return fetch("/api/admin?key="+encodeURIComponent(KEY)).then(function(r){
    if(r.status===401) throw new Error("unauthorized");
    return r.json();
  }).then(function(d){ if(!d.ok) throw new Error(d.error||"failed"); DATA=d; });
}

function askKey(msg){
  app.innerHTML = '<h1>ניהול משתתפות</h1><div class="sub">'+(msg||"הזיני את מפתח הכניסה")+'</div>'+
    '<input class="field" id="k" type="password" placeholder="מפתח כניסה" autocomplete="off">'+
    '<div style="height:10px"></div>'+
    '<input class="field" id="w" placeholder="השם שלך (נרשם ליד כל שינוי)" value="'+esc(WHO)+'">'+
    '<div style="height:10px"></div>'+
    '<button class="btn p" id="go">כניסה</button>';
  document.getElementById("go").onclick = function(){
    KEY = document.getElementById("k").value.trim();
    WHO = document.getElementById("w").value.trim();
    try{ localStorage.setItem("mp_admin_key",KEY); localStorage.setItem("mp_admin_who",WHO); }catch(e){}
    boot();
  };
  document.getElementById("k").onkeydown = function(e){ if(e.key==="Enter") document.getElementById("go").click(); };
}

function render(){
  var q = (document.getElementById("q") ? document.getElementById("q").value : "").trim().toLowerCase();

  // A group is a cohort AND a letter together. Every cohort runs א..ה (two to five of them),
  // so "קבוצה ב" of the January intake and "קבוצה ב" of the April intake are different
  // groups of different women. Merging them by letter alone is what produced "ב (522)".
  var pool = [], nNew = 0, nOld = 0;
  DATA.women.forEach(function(w){
    if(w.cancelled && !SHOWCANCELLED) return;
    if(!w.start) return;
    if(w.newApp) nNew++; else nOld++;
    if(APP==="new" && !w.newApp) return;
    if(APP==="old" && w.newApp) return;
    pool.push(w);
  });

  // Women still missing a group letter. Deliberately outside the app filter: one who started
  // this week and has not opened the app yet reads as Kajabi, and she is exactly the one to
  // catch. Turning this on becomes an ordinary filter, not a separate screen.
  var missing = DATA.women.filter(function(w){ return w.needsGroup; });
  var base = MISSING ? missing : pool;

  // Cohorts are chosen year, then month, then date. Every step is one tap on a chip: a
  // dropdown of forty-odd cohorts saved no time, and a single row of chips going back years
  // could not be read at all.
  var years = {}, months = {}, cohorts = {};
  base.forEach(function(w){ years[w.start.slice(0,4)] = (years[w.start.slice(0,4)]||0)+1; });
  var yearKeys = Object.keys(years).sort().reverse();
  if(YEAR === null || yearKeys.indexOf(YEAR) === -1) YEAR = yearKeys.length ? yearKeys[0] : "";

  base.forEach(function(w){
    if(w.start.slice(0,4) !== YEAR) return;
    months[w.start.slice(5,7)] = (months[w.start.slice(5,7)]||0)+1;
  });
  var monthKeys = Object.keys(months).sort().reverse();
  if(MONTH === null) MONTH = MISSING ? "" : (monthKeys.length ? monthKeys[0] : "");
  if(MONTH && monthKeys.indexOf(MONTH) === -1) MONTH = "";

  base.forEach(function(w){
    if(w.start.slice(0,4) !== YEAR) return;
    if(MONTH && w.start.slice(5,7) !== MONTH) return;
    cohorts[w.start] = (cohorts[w.start]||0)+1;
  });
  var dates = Object.keys(cohorts).sort().reverse();
  // In the missing-group view both cohorts are always drawn, even at zero. A cohort that
  // simply vanishes leaves the clerk guessing whether it is fine or whether it was filtered
  // out, and "(0)" answers that outright.
  if(MISSING){
    var wk = weekSundays();
    dates = [wk.next, wk.cur];
    dates.forEach(function(d){ if(!cohorts[d]) cohorts[d] = 0; });
  }
  if(COHORT && dates.indexOf(COHORT) === -1) COHORT = "";

  var inCohort = base.filter(function(w){
    if(w.start.slice(0,4) !== YEAR) return false;
    if(MONTH && w.start.slice(5,7) !== MONTH) return false;
    if(COHORT && w.start !== COHORT) return false;
    return true;
  });
  var groups = {}, noGroup = 0;
  inCohort.forEach(function(w){ if(w.group) groups[w.group]=(groups[w.group]||0)+1; else noGroup++; });
  var letters = Object.keys(groups).sort(function(a,b){ return a.localeCompare(b,"he"); });

  var searching = !!q;
  var list;
  if(searching){
    list = DATA.women.filter(function(w){
      return (w.first+" "+w.last+" "+w.email+" "+w.phone).toLowerCase().indexOf(q) !== -1;
    });
  } else {
    list = inCohort.filter(function(w){
      if(GROUP === "-") return !w.group;
      if(GROUP) return w.group === GROUP;
      return true;
    });
  }
  list.sort(function(a,b){ return (a.first+" "+a.last).localeCompare(b.first+" "+b.last,"he"); });

  var html = '<h1>ניהול משתתפות</h1>'+
    '<div class="sub">'+list.length+' משתתפות · מחוברת כ'+esc(WHO||"?")+'</div>'+
    '<input class="field" id="q" placeholder="🔍 חיפוש לפי שם, טלפון או מייל" value="'+esc(q)+'">'+
    (searching ? '<div class="note">תוצאות חיפוש מכל הרשומות בגיליון, בלי סינון לפי מחזור, קבוצה או אפליקציה.</div>' :
      '<div class="chips"><span class="chip'+(missing.length?" warn":"")+(MISSING?" on":"")+'" data-m="1">'+
        (missing.length?"⚠ ":"")+'חסרות קבוצה ('+missing.length+')</span></div>'+
      // Say what the list covers, so a woman who is missing from it does not read as a bug.
      (MISSING ? '<div class="note">מוצגות רק נשים ללא אות קבוצה במחזור של השבוע ובמחזור של השבוע הבא.</div>' : '')+
      (MISSING ? '' : '<div class="lbl">אפליקציה</div><div class="chips">'+
        '<span class="chip'+(APP==="new"?" on":"")+'" data-p="new">אפליקציה חדשה ('+nNew+')</span>'+
        '<span class="chip'+(APP==="old"?" on":"")+'" data-p="old">קג\'אבי ('+nOld+')</span>'+
        '<span class="chip'+(APP===""?" on":"")+'" data-p="">הכל</span>'+
      '</div>')+
      '<div class="lbl">שנה</div><div class="chips">'+
        yearKeys.map(function(y){ return '<span class="chip'+(YEAR===y?" on":"")+'" data-y="'+esc(y)+'">'+esc(y)+' ('+years[y]+')</span>'; }).join("")+
      '</div>'+
      '<div class="lbl">חודש</div><div class="chips">'+
        '<span class="chip'+(MONTH?"":" on")+'" data-mo="">כל השנה</span>'+
        monthKeys.map(function(mo){ return '<span class="chip'+(MONTH===mo?" on":"")+'" data-mo="'+esc(mo)+'">'+esc(HEB_MONTHS[parseInt(mo,10)-1])+' ('+months[mo]+')</span>'; }).join("")+
      '</div>'+
      // In the missing-group view the month is deliberately "whole year", but the cohorts
      // still matter there: they are the two Ron is placing.
      (MONTH || MISSING
        ? '<div class="lbl">מחזור</div><div class="chips">'+
          '<span class="chip'+(COHORT?"":" on")+'" data-d="">הכל</span>'+
          dates.map(function(d){ return '<span class="chip'+(COHORT===d?" on":"")+'" data-d="'+esc(d)+'">'+esc(cohortLabel(d))+' ('+cohorts[d]+')</span>'; }).join("")+
        '</div>'
        : '')+
      ((letters.length || noGroup)
        ? '<div class="lbl">קבוצה</div><div class="chips">'+
          '<span class="chip'+(GROUP?"":" on")+'" data-g="">הכל</span>'+
          letters.map(function(g){ return '<span class="chip'+(GROUP===g?" on":"")+'" data-g="'+esc(g)+'">'+esc(g)+' ('+groups[g]+')</span>'; }).join("")+
          (noGroup ? '<span class="chip warn'+(GROUP==="-"?" on":"")+'" data-g="-">ללא קבוצה ('+noGroup+')</span>' : '')+
          '</div>'
        : '')+
      '<div class="chips"><span class="chip'+(SHOWCANCELLED?" on":"")+'" data-c="1">כולל מבוטלות</span></div>');

  if(!list.length) html += '<div class="empty">'+
    (MISSING ? "אין כאן נשים ללא קבוצה. הכל משויך." : "לא נמצאה אף משתתפת")+'</div>';

  list.forEach(function(w){
    var nm = ((w.first||"")+" "+(w.last||"")).trim() || w.email;
    html += '<div class="card">'+
      '<div class="row1"><span class="nm">'+esc(nm)+'</span>'+
      (w.group?'<span class="grp">קבוצה '+esc(w.group)+(w.groupOverride?" ✎":"")+'</span>':'<span class="grp warnpill">אין קבוצה</span>')+
      (w.newApp?'<span class="grp newpill">אפליקציה חדשה</span>':'<span class="grp oldpill">קג\'אבי</span>')+
      (w.cancelled?'<span class="grp" style="background:#eee;color:#777">ביטלה</span>':'')+'</div>'+
      '<div class="meta">'+esc(w.phone||"אין טלפון")+' · '+esc(w.email)+'</div>'+
      '<div class="meta">מחזור '+il(w.start)+' · '+dayInProgram(w)+' · '+lastSeen(w)+'</div>'+
      (w.newApp
        ? '<div class="until">גישה עד: <b class="'+(w.expired?"expired":"")+'">'+(w.until?il(w.until):"לא ידוע")+'</b>'+
          (w.expired?" (הסתיימה)":"")+'</div>'
        : '')+
      (w.override?'<div class="manual">שונה ידנית · בגיליון: '+(w.sheetEnd?il(w.sheetEnd):"לא ידוע")+'</div>':'')+
      ((w.log&&w.log.length)?'<div class="log">'+w.log.map(function(L){
        var pre = esc(stamp(L.at))+' · '+esc(L.by||"לא ידוע")+' · ';
        if(L.field === "group"){
          return pre + (L.to ? 'שינתה את הקבוצה מ-'+(L.from?esc(L.from):"ללא קבוצה")+' ל-'+esc(L.to)
                             : 'החזירה את הקבוצה לערך שבגיליון'+(L.from?' (הייתה '+esc(L.from)+')':''));
        }
        return pre + (L.to ? 'שינתה את תאריך הגישה מ-'+(L.from?il(L.from):"לא ידוע")+' ל-'+il(L.to)
                           : 'החזירה את תאריך הגישה לערך שבגיליון'+(L.from?' (היה '+il(L.from)+')':''));
      }).join('<br>')+'</div>':'')+
      (EDITING===w.email
        ? '<div class="edit"><span>קבוצה:</span>'+
            '<select class="field sm" id="g_'+esc(w.email)+'">'+
              '<option value=""'+(w.group?"":" selected")+'>ללא קבוצה</option>'+
              ["א","ב","ג","ד","ה"].map(function(L){ return '<option value="'+L+'"'+(w.group===L?" selected":"")+'>'+L+'</option>'; }).join("")+
            '</select>'+
            '<button class="btn" data-savegroup="'+esc(w.email)+'">שמירת קבוצה</button>'+
            (w.groupOverride?'<button class="btn" data-cleargroup="'+esc(w.email)+'">חזרה לגיליון</button>':'')+
          '</div>'+
          '<div class="note">שיוך הקבוצה כאן משמש את האפליקציה בלבד. <b>יש לעדכן גם את הגיליון הראשי.</b></div>'+
          '<div class="edit"><span>גישה עד:</span><input class="field" style="max-width:190px" type="date" id="d_'+esc(w.email)+'" value="'+esc(w.until||"")+'">'+
          '<span class="adds">הוסיפי '+
            '<input class="field sm" style="width:70px" type="number" min="1" id="n_'+esc(w.email)+'" value="1">'+
            '<select class="field sm" style="width:100px" id="u_'+esc(w.email)+'">'+
              '<option value="d">ימים</option><option value="w">שבועות</option><option value="m">חודשים</option>'+
            '</select>'+
            '<button class="btn sm" data-add="1" data-for="'+esc(w.email)+'">הוסיפי</button>'+
          '</span>'+
          '<button class="btn p" data-save="'+esc(w.email)+'">שמירה</button>'+
          (w.override?'<button class="btn" data-clear="'+esc(w.email)+'">חזרה לגיליון</button>':'')+
          '<button class="btn" data-cancel="1">ביטול</button></div>'
        : '<div class="acts">'+
          (w.phone?'<a class="btn" href="https://wa.me/'+esc(w.phone)+'" target="_blank" rel="noopener">וואטסאפ</a>':'')+
          (w.newApp
            ? '<button class="btn" data-edit="'+esc(w.email)+'">עריכה</button>'+
              '<button class="btn" data-stats="'+esc(w.email)+'">'+(STATS===w.email?"סגירת נתוני שימוש":"נתוני שימוש")+'</button>'
            : '')+
          '</div>'+
          (w.newApp ? '' : '<div class="meta">מנוהלת בקג\'אבי. שינוי תאריך גישה ונתוני שימוש אינם רלוונטיים כאן.</div>'))+
      (STATS===w.email ? usagePanel(w) : '')+
      '</div>';
  });

  html += '<div class="note">שינוי כאן נשמר אצלנו וגובר על הגיליון. <b>הגיליון הראשי לא משתנה</b>, כי הוא הקובץ ש-ManyChat עובד איתו.</div>';
  app.innerHTML = html;

  var qEl = document.getElementById("q");
  qEl.oninput = function(){ var v=this.selectionStart; render(); var n=document.getElementById("q"); n.focus(); n.setSelectionRange(v,v); };

  app.querySelectorAll("[data-m]").forEach(function(el){ el.onclick=function(){
    MISSING=!MISSING; EDITING="";
    // Turning it on opens every cohort and preselects "ללא קבוצה", so what is on screen
    // matches what the chip promises without the clerk setting three filters by hand.
    YEAR = null; MONTH = MISSING ? "" : null; COHORT = ""; GROUP = MISSING ? "-" : "";
    render(); }; });
  app.querySelectorAll("[data-y]").forEach(function(el){ el.onclick=function(){
    YEAR = el.getAttribute("data-y"); MONTH = null; COHORT = ""; GROUP = ""; EDITING = ""; render(); }; });
  app.querySelectorAll("[data-mo]").forEach(function(el){ el.onclick=function(){
    MONTH = el.getAttribute("data-mo"); COHORT = ""; GROUP = ""; EDITING = ""; render(); }; });
  app.querySelectorAll("[data-p]").forEach(function(el){ el.onclick=function(){ APP=el.getAttribute("data-p"); YEAR=null; MONTH=null; COHORT=""; GROUP=""; EDITING=""; render(); }; });
  app.querySelectorAll("[data-d]").forEach(function(el){ el.onclick=function(){ COHORT=el.getAttribute("data-d"); GROUP=""; EDITING=""; render(); }; });
  app.querySelectorAll("[data-g]").forEach(function(el){ el.onclick=function(){ GROUP=el.getAttribute("data-g"); EDITING=""; render(); }; });
  app.querySelectorAll("[data-c]").forEach(function(el){ el.onclick=function(){ SHOWCANCELLED=!SHOWCANCELLED; render(); }; });
  app.querySelectorAll("[data-stats]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-stats"); STATS = (STATS===em ? "" : em); render(); }; });
  app.querySelectorAll("[data-sm]").forEach(function(el){ el.onclick=function(){
    STATSMODE = el.getAttribute("data-sm"); render(); }; });
  app.querySelectorAll("[data-edit]").forEach(function(el){ el.onclick=function(){ EDITING=el.getAttribute("data-edit"); render(); }; });
  // A clerk says "another two months", not a date. The amount and the unit are hers to
  // choose; months move by calendar month so "another month" lands on the same day number.
  app.querySelectorAll("[data-add]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-for"), inp=document.getElementById("d_"+em);
    var n = parseInt(document.getElementById("n_"+em).value,10);
    if(!(n>0)){ alert("צריך להזין מספר"); return; }
    var unit = document.getElementById("u_"+em).value;
    var d = new Date((inp.value||DATA.today)+"T00:00:00Z");
    if(unit==="m") d.setUTCMonth(d.getUTCMonth()+n);
    else d.setUTCDate(d.getUTCDate() + n*(unit==="w"?7:1));
    inp.value = d.toISOString().slice(0,10);
  }; });
  app.querySelectorAll("[data-cancel]").forEach(function(el){ el.onclick=function(){ EDITING=""; render(); }; });
  app.querySelectorAll("[data-save]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-save"), v=document.getElementById("d_"+em).value;
    if(!v){ alert("צריך לבחור תאריך"); return; }
    el.disabled=true; el.textContent="שומרת...";
    save(em,{until:v}).then(function(r){ if(!r.ok) throw new Error(); EDITING=""; return load().then(render); })
      .catch(function(){ alert("השמירה נכשלה. נסי שוב."); el.disabled=false; el.textContent="שמירה"; });
  }; });
  app.querySelectorAll("[data-savegroup]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-savegroup"), g=document.getElementById("g_"+em).value;
    el.disabled=true; el.textContent="שומרת...";
    save(em,{group:g}).then(function(r){ if(!r.ok) throw new Error(); EDITING=""; return load().then(render); })
      .catch(function(){ alert("השמירה נכשלה. נסי שוב."); el.disabled=false; el.textContent="שמירת קבוצה"; });
  }; });
  app.querySelectorAll("[data-cleargroup]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-cleargroup");
    el.disabled=true;
    save(em,{group:""}).then(function(r){ if(!r.ok) throw new Error(); EDITING=""; return load().then(render); })
      .catch(function(){ alert("הפעולה נכשלה. נסי שוב."); el.disabled=false; });
  }; });
  app.querySelectorAll("[data-clear]").forEach(function(el){ el.onclick=function(){
    var em=el.getAttribute("data-clear");
    el.disabled=true;
    save(em,{until:""}).then(function(r){ if(!r.ok) throw new Error(); EDITING=""; return load().then(render); })
      .catch(function(){ alert("הפעולה נכשלה. נסי שוב."); el.disabled=false; });
  }; });
}

function boot(){
  if(!KEY){ askKey(); return; }
  app.innerHTML = '<div class="empty">טוען...</div>';
  load().then(render).catch(function(e){
    if(String(e.message)==="unauthorized"){ KEY=""; try{ localStorage.removeItem("mp_admin_key"); }catch(x){} askKey("המפתח שגוי. נסי שוב."); }
    else app.innerHTML = '<div class="empty">לא הצלחתי לטעון את הנתונים. נסי לרענן.</div>';
  });
}

try{ KEY = localStorage.getItem("mp_admin_key")||""; WHO = localStorage.getItem("mp_admin_who")||""; }catch(e){}
var m = location.search.match(/[?&]key=([^&]+)/);
if(m){ KEY = decodeURIComponent(m[1]); try{ localStorage.setItem("mp_admin_key",KEY); }catch(e){} history.replaceState(null,"",location.pathname); }
boot();
</script>
</body>
</html>
