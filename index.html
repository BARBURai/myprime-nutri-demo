<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>מיי פריים 360 - אפליקציית הליווי</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#D45D79" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="מיי פריים 360" />

    <!-- Link preview (WhatsApp, Facebook, Telegram). Without these the preview
         falls back to the page title and the favicon, which showed the old name. -->
    <meta name="description" content="מיי פריים 360 - אפליקציית הליווי" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="מיי פריים 360" />
    <meta property="og:title" content="מיי פריים 360 - אפליקציית הליווי" />
    <meta property="og:description" content="מיי פריים 360 - אפליקציית הליווי" />
    <!-- No og:url on purpose. The app is served from two addresses at once (the original
         vercel one for the pilot, app.myprime.co.il for everyone who joins from 11 August
         2026), and a fixed og:url would tell WhatsApp that the shared link "really" belongs
         to the other one. A new participant would then land on the pilot's address and her
         diary would live there. Without the tag the preview simply follows whatever link
         was actually sent. -->
    <meta property="og:image" content="https://myprime-nutri-demo.vercel.app/share.jpg" />
    <meta property="og:image:width" content="400" />
    <meta property="og:image:height" content="400" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="מיי פריים 360 - אפליקציית הליווי" />
    <meta name="twitter:description" content="מיי פריים 360 - אפליקציית הליווי" />
    <meta name="twitter:image" content="https://myprime-nutri-demo.vercel.app/share.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
